async function saveMemo(force) {
  const plant = view.plant;
  const el = $('#memo');
  const text = el ? el.value : (memoDrafts[plant] || '');
  const base = (memos[plant] || {}).at || '';
  try {
    const j = await withBusy('メモを保存しています…', () => api('saveMemo', { plant, text, baseAt: base, force: !!force }));
    memos[plant] = j.memo;
    store.set('memos', memos);
    delete memoDrafts[plant];
    store.set('memoDrafts', memoDrafts);
    render();
  } catch (e) {
    if (e.code === 'memoconflict') {
      const c = await choose(`${e.message}。どうしますか？`, [
        { key: 'over', label: '自分の内容で上書きする', cls: 'warn' },
        { key: 'load', label: '最新の内容を表示する（自分の入力は消えます）' },
        { key: 'cancel', label: 'キャンセル（入力はそのまま）' },
      ]);
      if (c === 'over') return saveMemo(true);
      if (c === 'load') { delete memoDrafts[plant]; store.set('memoDrafts', memoDrafts); await withBusy('読み込み中…', () => refresh(true)); render(); }
      return;
    }
    alert(e.code === 'offline' ? 'メモの保存には電波が必要です。入力した内容はこの端末に残っています。' : e.message);
  }
}

function renderNet() {
  const el = $('#net');
  if (!el) return;
  const n = Object.values(drafts).filter(d => d.pending).length;
  el.className = 'net' + (!online ? ' off' : n ? ' pend' : '') + (netBusy ? ' busyn' : '');
  el.innerHTML = netBusy ? '<span class="mini-spin"></span>更新中…'
    : h((online ? 'オンライン' : '圏外') + (n ? ` 未送信${n}` : ''));
}

function renderSetup() {
  renderTop('検査入力 初期設定');
  const hasApi = cfg && cfg.api;
  const connected = hasApi && cfg.key;
  const keyField = `<label>合言葉<input id="s-key" type="password" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="例：abcd-2345"></label>`;
  // 接続済みなら合言葉は画面に出さず、名前選びだけを表示する。
  // 設定コード（URL）は覚えていて合言葉だけ無い＝合言葉が変わった場合は、合言葉の欄だけを出す
  $('#app').innerHTML = connected ? `
    <section class="card">
      <h2>名前を選ぶ</h2>
      <div class="notice done">サーバーに接続済みです。</div>
      <div id="s-names"></div>
      <button class="btn small" data-act="resetconn" style="margin-top:24px">接続設定をやり直す</button>
    </section>` : hasApi ? `
    <section class="card">
      <h2>合言葉の入力</h2>
      <p class="muted">合言葉が変更された場合は、新しい合言葉を事務所の担当者に確認してください。</p>
      ${keyField}
      <button class="btn primary" data-act="connect">接続して名前を選ぶ</button>
      <button class="btn small" data-act="resetconn" style="margin-top:24px">設定コードの貼り付けからやり直す</button>
    </section>` : `
    <section class="card">
      <h2>初期設定</h2>
      <label>設定コード<textarea id="s-code" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" style="min-height:90px" placeholder="KENSA1: で始まるコードを貼り付け"></textarea></label>
      ${keyField}
      <button class="btn primary" data-act="connect">接続して名前を選ぶ</button>
    </section>
    <p class="muted">設定コードと合言葉は事務所の担当者から受け取ってください。社外の人に見せないでください。</p>
    <p class="muted">Safari の共有ボタン →「ホーム画面に追加」で、圏外でもアプリとして開けるようになります。ホーム画面のアイコンから開いて設定してください。</p>`;
  if (connected) renderNames();
}

function renderNames() {
  const el = $('#s-names');
  if (!el) return;
  el.innerHTML = `<div class="muted" style="margin-bottom:8px">あなたの名前を選んでください</div>
    <div class="names">${names.map(n => `<button data-act="pickname" data-name="${h(n)}">${h(n)}</button>`).join('')}</div>`;
}

const FILTERS = { all: 'すべて', mine: '自分', todo: '未着手', work: '作業中', done: '完了' };

const listScope = () => devices.filter(d => plantOf(d) === view.plant && (view.loc === ALL || fileOf(d) === view.loc));

function renderList() {
  const scope = listScope();
  renderTop(view.loc === ALL ? 'すべての機器' : fileLabel(view.loc), BACK_LABEL.locs);
  const counts = Object.fromEntries(Object.values(ST).map(s => [s, scope.filter(d => d.status === s).length]));
  $('#app').innerHTML = `
    ${progress(scope)}
    <div class="filters" style="margin-top:10px">${Object.entries(FILTERS).map(([k, v]) => `<button class="${view.filter === k ? 'on' : ''}" data-act="filter" data-f="${k}">${v}</button>`).join('')}</div>
    <input class="search" id="q" type="search" placeholder="計器番号・調節弁番号・名称で検索" value="${h(view.q)}">
    <div class="muted">未着手 ${counts[ST.TODO]} ／ 作業中 ${counts[ST.WORK]} ／ 完了 ${counts[ST.DONE]}　<span>更新 ${h(hm(fetchedAt))}</span></div>
    <div id="results">${listResults(scope)}</div>
    <button class="btn" data-act="refresh">一覧を更新</button>`;
}

// 検索欄は作り直さず、結果だけを書き換える（日本語入力の変換中に欄を作り直すと文字が二重に入るため）
function listResults(scope) {
  const q = view.q.trim().toLowerCase();
  const match = d => {
    const st = d.status;
    const dr = drafts[d.id];
    if (view.filter === 'mine' && !(st === ST.WORK && d.worker === cfg.name) && !(dr && dr.pending)) return false;
    if (view.filter === 'todo' && st !== ST.TODO) return false;
    if (view.filter === 'work' && st !== ST.WORK) return false;
    if (view.filter === 'done' && st !== ST.DONE) return false;
    return !q || (d.tag + ' ' + d.title + ' ' + (d.info.name || '')).toLowerCase().includes(q);
  };
  const groups = {};
  scope.filter(match).forEach(d => (groups[d.file] = groups[d.file] || []).push(d));
  return Object.entries(groups).map(([file, list]) => `
      ${view.loc === ALL ? `<div class="group">${h(fileLabel(file))}</div>` : '<div style="height:8px"></div>'}
      ${list.map(itemButton).join('')}`).join('') || '<p class="muted">該当する機器がありません</p>';
}

function infoCard(d) {
  const i = d.info;
  const row = (k, v) => v ? `<dt>${k}</dt><dd>${v}</dd>` : '';
  const prev = `${h(i.prev.date || '')}　${h((i.prev.inspectors || []).filter(Boolean).join('・'))}`;
  if (d.kind === KIND.TOUCH) {
    return `<section class="card"><div class="ttlrow"><div>${h(d.tag)}</div>${flagButton(d)}</div>${notePeek(d)}<dl class="info">
      ${row('No.', h(i.no) + '（' + h(d.sheet) + '）')}${row('設置場所', h(i.loc))}${row('台数', i.panels.length + ' 台')}${row('前回', prev)}</dl>${detailsBlock(i)}</section>`;
  }
  return `<section class="card"><div class="ttlrow"><div>${h(i.name || d.title)}</div>${flagButton(d)}</div>${notePeek(d)}<dl class="info">
    ${row('No.', h(i.no) + '（' + h(d.sheet) + '）' + (i.kanri ? '　管理番号 ' + h(i.kanri) : ''))}
    ${row('場所', h(i.loc))}${row('型番', h(i.model))}${row('製造番号', h(i.serial))}
    ${row('範囲', (i.ranges || []).map(h).join('<br>'))}
    ${row('精度', accuracyText(i))}${row('前回', prev)}</dl>${detailsBlock(i)}</section>`;
}

// ---- 機器メモ・フラグ（全員で共有。Excelには書かない。データ初期化しても消えない）----
function flagButton(d) {
  if (PREVIEW) return '';
  const on = !!(notes[d.id] || {}).flag;
  return `<button type="button" class="flagbtn ${on ? 'on' : ''}" data-act="flag">${on ? 'フラグ中' : 'フラグ'}</button>`;
}

// メモがあれば機器画面の上に1行だけ出す（押すと下のメモ欄へ移動）
function notePeek(d) {
  const t = ((notes[d.id] || {}).text || '').trim();
  return t ? `<button type="button" class="notepeek" data-act="gonote">メモ：${h(t.split('\n')[0])}</button>` : '';
}

function devMemoSection(d) {
  const n = notes[d.id] || { text: '', at: '', by: '' };
  const draft = noteDrafts[d.id];
  const unsaved = draft != null && draft !== (n.text || '');
  return `<section class="card" id="devmemo-card"><h3 style="margin-top:0">機器メモ <small>Excelには反映されません・データ初期化しても消えません</small></h3>
    <textarea id="devmemo" class="memo" style="min-height:80px" placeholder="この機器についての連絡事項など（全員で共有）">${h(draft != null ? draft : (n.text || ''))}</textarea>
    <div class="memoinfo"><span>${n.at ? `最終更新 ${h(hm(n.at))}${n.by ? ' ' + h(n.by) : ''}` : 'まだ書かれていません'}</span>
      <span id="devmemo-state" class="${unsaved ? 'ng' : ''}">${unsaved ? '未保存' : ''}</span></div>
    <button class="btn small primary" data-act="savedevmemo">メモを保存</button></section>`;
}

async function saveDevMemo(force) {
  const d = getDev(view.id);
  if (!d) return;
  const el = $('#devmemo');
  const text = el ? el.value : (noteDrafts[d.id] || '');
  const base = (notes[d.id] || {}).at || '';
  try {
    const j = await withBusy('メモを保存しています…', () => api('saveDevMemo', { id: d.id, tag: d.tag, plant: d.plant, text, baseAt: base, force: !!force }));
    notes[d.id] = j.note;
    store.set('notes', notes);
    delete noteDrafts[d.id];
    store.set('noteDrafts', noteDrafts);
    renderDetail();
  } catch (e) {
    if (e.code === 'memoconflict') {
      const c = await choose(`${e.message}。どうしますか？`, [
        { key: 'over', label: '自分の内容で上書きする', cls: 'warn' },
        { key: 'load', label: '最新の内容を表示する（自分の入力は消えます）' },
        { key: 'cancel', label: 'キャンセル（入力はそのまま）' },
      ]);
      if (c === 'over') return saveDevMemo(true);
      if (c === 'load') { delete noteDrafts[d.id]; store.set('noteDrafts', noteDrafts); await withBusy('読み込み中…', () => refresh(true)); renderDetail(); }
      return;
    }
    alert(e.code === 'offline' ? 'メモの保存には電波が必要です。入力した内容はこの端末に残っています。' : e.message);
  }
}

async function toggleFlag() {
  const d = getDev(view.id);
  if (!d) return;
  const flag = !(notes[d.id] || {}).flag;
  try {
    const j = await withBusy(flag ? 'フラグを付けています…' : 'フラグを外しています…', () => api('setFlag', { id: d.id, tag: d.tag, plant: d.plant, flag }));
    notes[d.id] = j.note;
    store.set('notes', notes);
    renderDetail();
  } catch (e) {
    alert(e.code === 'offline' ? 'フラグの変更には電波が必要です。' : e.message);
  }
}

// 精度：報告書の書き方どおり（例：±1 ﾃﾞｼﾞｯﾄ　±0.5 ％ F.S）。登録データが古い場合は %F.S だけ
function accuracyText(i) {
  const d = (i.details || []).find(x => x.label === '精度');
  if (d) return h(d.value);
  return i.accuracy != null ? '±' + h(i.accuracy) + ' %F.S' : '';
}

// 「詳細を表示」：報告書上部の機器情報をすべて、1項目ずつ縦に並べて出す
function detailsBlock(i) {
  const list = i.details || [];
  // 記録計・タッチパネルは「修正手順」（画像）も見られるようにする
  const d = getDev(view.id);
  // 記録計で調節計・指示計の条件にも当てはまる機種（名称に「記録計」と「調節計」か「指示計」の両方を含むもの。例：温度記録計（指示計）。
  //   「指示記録計」「記録調節計」は「指示計」「調節計」が続けて書かれていないので当てはまらない）は、時刻合わせと PVフィルタ・バイアスの両方を選べる
  //   ボタン名は機器種類の手順で決まる（時刻合わせ・輝度調整＝修正手順、PVフィルタ・バイアス＝確認手順、両方＝修正・確認手順）
  const procs = d ? manualProcs(d) : [];
  const fix = procs.some(p => p !== 'bias');
  const label = !procs.length ? '' : d.kind === KIND.TOUCH ? '修正手順' : fix && procs.includes('bias') ? '修正・確認手順' : fix ? '修正手順' : '確認手順';
  const manual = label ? `<button type="button" class="btn small" data-act="manual">${label}</button>` : '';
  if (!list.length) return manual;
  return `${manual}<button type="button" class="btn small" data-act="details">${view.details ? '詳細を閉じる ▲' : '詳細を表示 ▼'}</button>
    ${view.details ? `<div class="details">${list.map(x => `<div class="ditem"><div class="dl">${h(x.label)}</div><div class="dv">${h(x.value).replace(/\n/g, '<br>')}</div></div>`).join('')}</div>` : ''}`;
}

function renderDetail() {
  const d = getDev(view.id);
  if (!d) { leaveDetail(); return render(); }
  renderTop(d.tag, BACK_LABEL[view.from] || BACK_LABEL.list);
  const mine = d.status === ST.WORK && d.worker === cfg.name;
  if (mine && !drafts[d.id]) { drafts[d.id] = { data: normalize(d, d.data), rev: 0, pending: false }; saveDrafts(); }
  const dr = drafts[d.id];
  // 前のバージョンで作った下書きには、後から増えた項目（確認欄・作業員など）が無いため、今の形にそろえる
  if (dr) dr.data = normalize(d, dr.data);
  let head = '', data = null, editable = false, actions = '';

  if (dr && dr.blocked) {
    head = `<div class="notice err">送信できませんでした：${h(dr.blocked)}<br>入力した値はこの端末に残っています。「作業を再開」でロックを取り直すと送信できます。</div>`;
    data = dr.data;
    actions = `<button class="btn primary" data-act="start">作業を再開</button>`;
  } else if (mine) {
    if (dr.finish && dr.pending) head = `<div class="notice work">完了済み（未送信）。電波が戻ると自動で送信されます。</div>`;
    data = dr.data;
    editable = true;
    actions = `<button class="btn warn" data-act="release" style="flex:1">作業を中断</button><button class="btn ok" data-act="finish" style="flex:2">完了して送信</button>`;
  } else if (d.status === ST.WORK) {
    head = `<div class="notice work"><b>${h(d.worker)}</b> さんが作業中です（${h(hm(d.startedAt))} 開始）。入力はできません。</div>`;
    data = d.data ? normalize(d, d.data) : null;
    actions = `<button class="btn warn" data-act="force">強制解除（放置されている場合）</button>`;
  } else if (d.status === ST.DONE) {
    // 反映した後に直して再び完了したもの（updatedAt が新しい）は、まだ反映されていない
    const exported = d.exportedAt && !(String(d.updatedAt || '') > String(d.exportedAt));
    head = `<div class="notice done">完了済みです（${h(hm(d.updatedAt))}${d.worker ? '・' + h(d.worker) : ''}）${exported ? '・Excel反映済み' : d.exportedAt ? '・Excel未反映（反映後に修正）' : ''}</div>`;
    data = normalize(d, d.data);
    actions = `<button class="btn" data-act="reopen">修正のため再開する</button>`;
  } else {
    const st = localStatus(d);
    head = st.cls === 'wait' || st.cls === 'temp'
      ? `<div class="notice">${h(st.text)}：${h(d.worker)} さんが途中まで入力して中断しています（${h(hm(d.updatedAt))}）。「作業開始」で続きから入力できます。</div>`
      : `<div class="notice">この機器は未着手です。「作業開始」を押すと、他の人は入力できなくなります。</div>`;
    data = d.data ? normalize(d, d.data) : null;
    actions = `<button class="btn primary" data-act="start">作業開始</button>`;
  }

  // プレビューでは保存・送信のボタンを出さない
  if (PREVIEW) actions = '<div class="muted" style="flex:1;text-align:center;padding:8px">プレビュー：入力を試せますが、保存・送信はしません</div>';
  $('#app').innerHTML = `${infoCard(d)}${head}
    ${data ? `<section class="card">${form(d, data, editable)}</section>` : ''}
    ${PREVIEW ? '' : devMemoSection(d)}
    <div class="actions"><div class="inner">${actions}</div></div>`;
  if (data) updateDevs(d, data);
  markMissing();
}

// ---- 入力フォーム ----
const opts = (list, v) => (list.includes(v) || !v ? list : list.concat([v])).map(x => `<option ${x === v ? 'selected' : ''}>${h(x)}</option>`).join('');

// prev（前回値）は入力欄の中の薄字に加え、入力後も見えるよう欄の下に小さく出す
function numInput(path, val, prev, editable, presets) {
  const p = fmt(prev);
  return `<input class="num" inputmode="decimal" autocomplete="off" data-k="${path}" value="${h(val)}" placeholder="${h(p)}"${presets ? ` data-presets="${h(presets)}"` : ''} ${editable ? '' : 'disabled'}>
    <div class="hint"><span class="prev">${p !== '' ? '前 ' + h(p) : ''}</span><span class="dev" data-dev="${path}"></span></div>`;
}

function pointTable(ch, k, upKey, downKey, c, editable, caption, showPrev) {
  const rows = ch.points.map((p, i) => `<tr>
      <td class="ref">${h(fmt(p.pct))}%</td>
      <td class="ref">${h(fmt(p.input))}</td>
      <td class="ref">${h(fmt(p.expect))}</td>
      <td>${numInput(`ch.${k}.${upKey}.${i}`, c[upKey][i], showPrev ? p.prevUp : '', editable, ch.presets)}</td>
      <td>${i < 4 ? numInput(`ch.${k}.${downKey}.${i}`, c[downKey][i], showPrev ? p.prevDown : '', editable, ch.presets) : '<div class="ref" style="padding-top:12px">―</div>'}</td>
    </tr>`).join('');
  return `<table class="pt"><caption>${caption}</caption>
    <colgroup><col style="width:15%"><col style="width:15%"><col style="width:16%"><col style="width:27%"><col style="width:27%"></colgroup>
    <thead><tr><th>測定点</th><th>入力<br>${h(ch.unitIn)}</th><th>${h(ch.expectLabel || '基準')}<br>${h(ch.unitDisp)}</th><th>UP</th><th>DOWN</th></tr></thead>
    <tbody>${rows}</tbody></table>`;
}

function form(d, data, editable) {
  const i = d.info;
  const dis = editable ? '' : 'disabled';
  // 何を出すかは機器種類の設定（opt）で決まる。試験日はタッチパネルでは試験日欄がある様式だけ
  const showDate = opt(d, 'date') && (d.kind !== KIND.TOUCH || i.hasDate);
  const showTemp = opt(d, 'temp');
  const showChecks = opt(d, 'checks');
  let html = `<div class="grid2">
      ${showDate ? `<label>試験日<input type="date" data-k="date" value="${h(data.date)}" ${dis}></label>` : ''}
      ${showTemp ? `<label>温度 (℃)<input class="num" inputmode="decimal" data-k="temp" value="${h(data.temp)}" placeholder="${h(fmt(i.prev.temp))}" ${dis}>
        <div class="hint"><span class="prev">${i.prev.temp != null ? '前回 ' + h(fmt(i.prev.temp)) + '℃' : ''}</span></div></label>` : ''}
    </div>
    ${showTemp && editable && opt(d, 'lastTemp') ? lastTempBlock() : ''}
    ${showDate || !opt(d, 'date') ? '' : '<p class="muted">この報告書には試験日の欄がありません。</p>'}`;
  // 並び：試験日・温度 → 機器情報の確認 → PV（計器）→ 時刻合わせ（記録計）
  const checks = i.checks || [];
  const checkHelp = '<small>現物と見比べて「確認」。違っていたら「変更」（報告書のセルが黄色になります）</small>';
  if (d.kind !== KIND.TOUCH && checks.length && showChecks) html += `<h3>機器情報の確認 ${checkHelp}</h3>${checkRows(data, checks, editable, d)}`;
  if (d.kind === KIND.TOUCH && checks.length && showChecks) html += `<h3>機器情報の確認 ${checkHelp}</h3>`;
  if (opt(d, 'pv') && pvItems(d).length) html += `<h3>PV</h3>${pvFields(d, data, editable)}`;
  if (opt(d, 'clock')) html += clockSection(d, data, editable);

  if (d.kind === KIND.TOUCH) {
    html += i.panels.map((p, b) => {
      const pd = data.panels[b];
      const items = i.items.map((label, j) => {
        if (j === 2) {
          return `<div class="pclock"><span>${h(label)}</span>
              <select data-k="panels.${b}.clockDir" ${dis}>${opts([CLOCK_OK, '遅れ', '進み'], pd.clockDir)}</select></div>
            ${pd.clockDir && pd.clockDir !== CLOCK_OK ? `<div class="pclock"><span>ずれ（分）</span>
              <input class="num" inputmode="decimal" data-k="panels.${b}.clockMin" value="${h(pd.clockMin)}" placeholder="分" ${dis}></div>` : ''}
            <div class="ptext">(今回)<span data-ptext="${b}">${h(pd.items[2])}</span></div>
            <div class="ptext">(前回)${h((p.prev || [])[2] || '')}</div>`;
        }
        // 画面切り替えの下に、日本標準時（NICT）を表示するボタン
        const jst = j === 3 && opt(d, 'jst') ? '<button type="button" class="btn small" data-act="jst">日本標準時間</button>' : '';
        return `<div class="pitem"><span>${h(label)}</span><select data-k="panels.${b}.items.${j}" ${dis}>${opts(['良好', '不良'], pd.items[j])}</select></div>${jst}`;
      }).join('');
      const pc = checks.filter(c => c.panel === b);
      const prevNg = (p.prev || []).filter((x, j) => j !== 2 && x && x !== '良好');
      return `<div class="panel"><div class="pname">${h(p.name)}</div>
        ${pc.length && showChecks ? checkRows(data, pc, editable, d) : `<div class="muted">${h(p.model)}　${h(p.serial)}${p.made ? '　' + h(p.made) : ''}</div>`}${items}
        ${prevNg.length ? `<div class="ptext">前回（時計以外）：${h(prevNg.join('／'))}</div>` : ''}</div>`;
    }).join('');
  } else {
    i.chs.forEach((ch, k) => {
      const c = data.ch[k];
      const title = d.kind === KIND.VALVE ? 'ストローク' : (i.chs.length > 1 ? 'CH' + (k + 1) + ' ' : '') + '測定値';
      html += `<h3>${title} <small>目盛 ${h(ch.scale)}　「前」＝前回値</small></h3>`;
      html += pointTable(ch, k, 'up', 'down', c, editable, '調整前', true);
      // 「調整した」を出さない種類でも、既に調整後の値がある（チェック済み）なら外せるように出す
      if (opt(d, 'adjust') || c.adj) html += `<label class="chk"><input type="checkbox" data-k="ch.${k}.adj" ${c.adj ? 'checked' : ''} ${dis}>調整した（調整後の値も入力）</label>`;
      if (c.adj) html += pointTable(ch, k, 'adjUp', 'adjDown', c, editable, '調整後', false);
    });
    if (d.kind === KIND.KEIKI) {
      if (opt(d, 'result')) html += `<div class="grid2" style="margin-top:12px">
        <label>判定<select data-k="result" ${dis}>${opts(['合格', '不合格'], data.result)}</select></label></div>`;
    } else {
      if (opt(d, 'result')) html += `<div class="grid2" style="margin-top:12px">
        <label>判定<select data-k="judge" ${dis}>${opts(['良好', '動作不良'], data.judge)}</select></label></div>`;
      if (opt(d, 'tests')) html += testsSection(d, data, editable);
    }
    if (opt(d, 'parts')) html += partsSection(d, data, editable);
  }

  // 署名（印影）：報告書の検査・作業員欄の一番右が作業員、右から2番目より左が検査員（押した順）
  const sel = data.inspectors;
  const pick = [...new Set(names.concat(sel, data.worker ? [data.worker] : []))];
  html += `<h3>作業員 <small>報告書の検査・作業員欄の一番右に印影が入ります</small></h3>
    <div class="names pick" id="worker-group">${pick.map(n => `<button type="button" class="${data.worker === n ? 'on' : ''}" data-act="worker" data-name="${h(n)}" ${dis}>${h(n)}</button>`).join('')}</div>
    <h3>検査員 <small>押した順に、右から2番目の枠から左へ印影が入ります（最大${MAX_STAMPS - 1}名）</small></h3>
    <div class="names pick" id="insp-group">${pick.map(n => {
      const k = sel.indexOf(n);
      return `<button type="button" class="${k >= 0 ? 'on' : ''}" data-act="insp" data-name="${h(n)}" ${dis}>${k >= 0 ? (k + 1) + '. ' : ''}${h(n)}</button>`;
    }).join('')}</div>
    <label style="margin-top:14px">記事<textarea data-k="note" ${dis}>${h(data.note)}</textarea></label>
    <div class="noteprev" id="noteprev">${notePreview(d, data.note)}</div>
    ${i.chs && i.chs.length && opt(d, 'deviation') ? '<p class="muted">誤差は「(測定値−基準)÷スパン」の目安です。精度を超えると赤字になります。正式な値はExcelで計算されます。</p>' : ''}`;
  return html;
}

function updateDevs(d, data) {
  const on = opt(d, 'deviation');
  document.querySelectorAll('[data-dev]').forEach(el => {
    if (!on) { el.textContent = ''; el.className = 'dev'; return; }
    const [, k, key, i] = el.dataset.dev.split('.');
    const ch = d.info.chs[k];
    const p = ch && ch.points[i];
    const v = data.ch[k][key][i];
    if (!p || !isNum(v) || !isNum(p.expect) || !ch.span) { el.textContent = ''; el.className = 'dev'; return; }
    const dev = (+v - +p.expect) / ch.span * 100;
    el.textContent = (dev > 0 ? '+' : '') + dev.toFixed(2) + '%';
    el.className = 'dev' + (d.info.accuracy != null && Math.abs(dev) > d.info.accuracy + 1e-9 ? ' ng' : '');
  });
}

// ---- 操作 ----
async function startWork(reopen) {
  const id = view.id;
  try {
    const j = await withBusy('作業開始中…', () => api('start', { id, reopen: !!reopen }));
    updateDevice(j.device);
    const dr = drafts[id];
    if (dr) {
      dr.blocked = null;  // 端末に残っている入力を優先して続ける
      if (dr.pending) scheduleSync(500);
    } else {
      drafts[id] = { data: normalize(j.device, j.device.data), rev: 0, pending: false };
    }
    saveDrafts();
  } catch (e) {
    alert(e.code === 'offline' ? '作業開始（ロック）には電波が必要です。電波のある場所で押してください。' : e.message);
    if (e.code === 'locked' || e.code === 'done') await refresh(true);
  }
  render();
}

// 画面下からせり上がる選択ダイアログ。押したボタンの key を返す（外側を押したら null）
function choose(message, options) {
  return new Promise(resolve => {
    const el = document.createElement('div');
    el.className = 'modal';
    el.innerHTML = `<div class="box"><div class="msg">${h(message)}</div>
      ${options.map(o => `<button class="btn ${o.cls || ''}" data-choose="${h(o.key)}">${h(o.label)}</button>`).join('')}</div>`;
    el.addEventListener('click', e => {
      const b = e.target.closest('[data-choose]');
      if (!b && e.target !== el) return;
      el.remove();
      resolve(b ? b.dataset.choose : null);
    });
    document.body.appendChild(el);
  });
}

async function releaseWork() {
  const c = await choose('作業を中断して、他の人も入力できるようにします。ここまでの入力をどうしますか？', [
    { key: 'save', label: '保存して中断（入力を残す）', cls: 'primary' },
    { key: 'discard', label: '破棄して中断（開始前に戻す）', cls: 'warn' },
    { key: 'cancel', label: 'キャンセル（作業を続ける）' },
  ]);
  if (c !== 'save' && c !== 'discard') return;
  if (c === 'discard' && !confirm('作業開始後に入力した値をすべて消して、作業開始前の状態に戻します。アプリからは元に戻せません。よろしいですか？')) return;
  const id = view.id;
  try {
    const dr = drafts[id];
    const j = await withBusy('中断しています…', async () => {
      if (c === 'save' && dr && dr.pending) await api('save', { id, data: dr.data, finish: false });
      return api('release', { id, discard: c === 'discard' });
    });
    updateDevice(j.device);
    delete drafts[id];
    saveDrafts();
    leaveDetail();
  } catch (e) {
    alert(e.code === 'offline' ? '中断（ロック解除）には電波が必要です。' : e.message);
  }
  render();
}

async function forceRelease() {
  const d = getDev(view.id);
  if (!confirm(`${d.worker} さんの作業を強制的に解除します。\n${d.worker} さんのiPhoneに未送信の入力が残っている場合、その人は「作業を再開」が必要になります。\n本人に確認しましたか？`)) return;
  try {
    const j = await withBusy('解除しています…', () => api('forceRelease', { id: d.id }));
    updateDevice(j.device);
  } catch (e) {
    alert(e.code === 'offline' ? '強制解除には電波が必要です。' : e.message);
  }
  render();
}

// 完了前に確認する未記入の箇所。調整したチェック（と調整しない場合の調整後の値）、2人目以降の検査員は対象外
//   何を対象にするかは機器種類の設定（〇〇Req）で決まる（出していない要素は対象外）
function findMissing(d, data) {
  const keys = [];
  if (opt(d, 'pointsReq')) data.ch.forEach((c, k) => {
    const pairs = c.adj ? [['up', 'down'], ['adjUp', 'adjDown']] : [['up', 'down']];
    pairs.forEach(([u, dn]) => {
      for (let i = 0; i < 5; i++) {
        if (String(c[u][i]).trim() === '') keys.push(`ch.${k}.${u}.${i}`);
        if (i < 4 && String(c[dn][i]).trim() === '') keys.push(`ch.${k}.${dn}.${i}`);
      }
    });
  });
  const temp = opt(d, 'tempReq') && String(data.temp || '').trim() === '';
  if (temp) keys.push('temp');
  const clockOn = opt(d, 'clockReq');
  const clock = clockOn && !data.clock.done;
  if (clock) keys.push('clock.done');
  // 時計のずれの量：記録計で「有」、タッチパネルで「遅れ／進み」を選んだのに空欄（報告書が「○分」になってしまう）
  const clockAmt = [];
  if (clockOn && data.clock.done === '有' && !String(data.clock.amount || '').trim()) clockAmt.push('clock.amount');
  if (opt(d, 'touchClockReq')) (data.panels || []).forEach((p, b) => {
    if (p.clockDir && p.clockDir !== CLOCK_OK && !String(p.clockMin || '').trim()) clockAmt.push(`panels.${b}.clockMin`);
  });
  keys.push(...clockAmt);
  // PV（計器）：「不要」にしていない空欄
  const pv = opt(d, 'pvReq') ? pvItems(d).filter(it => !data.pv.na[it.path] && !pvInput(data, it)).map(it => it.path) : [];
  keys.push(...pv);
  const checks = opt(d, 'checksReq') ? (d.info.checks || []).filter(c => !fieldOf(data, c).ok).map(c => c.key) : [];
  const noWorker = opt(d, 'workerReq') && !data.worker;
  const noInsp = opt(d, 'inspReq') && !data.inspectors.length;
  const msg = [];
  const meas = keys.filter(k => k.startsWith('ch.')).length;  // 温度・時刻合わせは個別に数える
  if (meas) msg.push(`・測定値 ${meas} か所`);
  if (temp) msg.push('・温度');
  if (clock) msg.push('・時刻合わせの有無');
  if (clockAmt.length) msg.push(`・時計のずれの量 ${clockAmt.length} か所`);
  if (pv.length) msg.push(`・PV ${pv.length} か所（機器に無い項目は「不要」）`);
  if (checks.length) msg.push(`・機器情報の「確認」 ${checks.length} 件`);
  if (noWorker) msg.push('・作業員');
  if (noInsp) msg.push('・検査員（1名以上）');
  return { keys, checks, worker: noWorker, insp: noInsp, msg };
}

// 未記入の箇所を赤枠にする（完了しようとした後だけ。入力するたびに更新）
function markMissing() {
  document.querySelectorAll('.missing').forEach(el => el.classList.remove('missing'));
  const d = getDev(view.id);
  const dr = drafts[view.id];
  if (!view.showMissing || !d || !dr) return;
  const m = findMissing(d, dr.data);
  m.keys.forEach(k => { const el = document.querySelector(`[data-k="${k}"]`); if (el) el.classList.add('missing'); });
  m.checks.forEach(k => { const b = document.querySelector(`[data-act=fieldok][data-key="${k}"]`); if (b) b.closest('.crow').classList.add('missing'); });
  if (m.worker) { const g = $('#worker-group'); if (g) g.classList.add('missing'); }
  if (m.insp) { const g = $('#insp-group'); if (g) g.classList.add('missing'); }
}

async function finishWork() {
  const d = getDev(view.id);
  const dr = drafts[view.id];
  const over = splitNote(dr.data.note, d.info.noteCaps || DEFAULT_NOTE_CAPS).length - (d.info.noteCaps || DEFAULT_NOTE_CAPS).length;
  if (over > 0 && !confirm(`記事が記事欄に入りきりません（${over} 行はみ出し）。はみ出した分はExcelに書き込まれません。このまま完了にしますか？`)) return;
  const m = findMissing(d, dr.data);
  if (m.msg.length) {
    view.showMissing = true;
    markMissing();
    if (!confirm(`未記入の項目があります（赤枠の箇所）。\n${m.msg.join('\n')}\n\n未記入のまま完了にして送信しますか？`)) {
      const first = document.querySelector('.missing');
      if (first) first.scrollIntoView({ behavior: 'smooth', block: 'center' });
      return;
    }
  } else if (!confirm('完了にして送信します。よろしいですか？')) return;
  dr.finish = true;
  touchDraft(view.id);
  await withBusy('送信しています…', () => sync());
  alert(drafts[view.id] ? 'この端末に保存しました。電波が戻ると自動で送信されます。' : '送信しました。');
  leaveDetail();
  render();
}

// 入力画面から、開く前にいた画面（工場・報告書・一覧）へ戻る
function leaveDetail() {
  view.screen = view.from && view.from !== 'detail' ? view.from : 'list';
}

// 入力画面のボタン操作（検査・作業員、交換済み）で下書きを変更する
function editDraft(fn) {
  const dr = drafts[view.id];
  const d = getDev(view.id);
  if (!dr || !d || !(d.status === ST.WORK && d.worker === cfg.name) || dr.blocked) return;
  if (fn(dr.data) === false) return;
  touchDraft(view.id);
  renderDetail();
}

function toggleInspector(name) {
  editDraft(data => {
    const i = data.inspectors.indexOf(name);
    if (i >= 0) { data.inspectors.splice(i, 1); return; }
    if (data.inspectors.length >= MAX_STAMPS - 1) { alert(`検査員は ${MAX_STAMPS - 1} 名までです（一番右の枠は作業員）。`); return false; }
    if (data.worker === name) data.worker = '';  // 同じ人は作業員と検査員の両方には入れない
    data.inspectors.push(name);
  });
}

function setWorker(name) {
  editDraft(data => {
    data.worker = data.worker === name ? '' : name;
    data.inspectors = data.inspectors.filter(n => n !== data.worker);
  });
}

// 機器情報を現場の表示に合わせて変更する。変更したら記事に1行追加するかを選ぶ
async function editField(key) {
  const d = getDev(view.id);
  const dr = drafts[view.id];
  if (!d || !dr || !(d.status === ST.WORK && d.worker === cfg.name) || dr.blocked) return;
  const c = (d.info.checks || []).find(x => x.key === key);
  if (!c) return;
  const f = fieldOf(dr.data, c);
  if (f.ok) return;  // 確認済みの項目は変更できない（変更するときは「確認」を押して外す）
  const v = await askText(`${checkName(d, c)}を現場の表示に合わせて変更します。\n報告書の値：${c.value || '（空欄）'}`, f.value != null ? f.value : c.value);
  if (v == null) return;
  const nv = v.trim();
  if (nv === (c.value || '')) {
    if (dr.data.fields[key]) delete dr.data.fields[key].value;  // 元に戻した
  } else {
    const line = `${checkName(d, c)}：${c.value || '（空欄）'}が${nv || '（空欄）'}に変更されていた`;
    const add = await choose(`記事に次の1行を追加しますか？\n「${line}」`, [
      { key: 'add', label: '記事に追加する', cls: 'primary' },
      { key: 'no', label: '追加しない' },
    ]);
    dr.data.fields[key] = Object.assign({}, f, { value: nv });
    if (add === 'add') dr.data.note = (String(dr.data.note || '').replace(/\s+$/, '') + '\n' + line).replace(/^\n/, '');
  }
  touchDraft(view.id);
  renderDetail();
}

// ---- イベント ----
document.addEventListener('click', async e => {
  const b = e.target.closest('[data-act]');
  if (!b) return;
  const act = b.dataset.act;
  if (act === 'back') {
    if (view.screen === 'detail') leaveDetail();
    else view.screen = view.screen === 'list' ? 'locs' : 'plants';
    render();
    window.scrollTo(0, 0);
    refresh(true);
  }
  else if (act === 'plant') { view.plant = b.dataset.key; view.loc = null; view.screen = 'locs'; saveNav(); render(); window.scrollTo(0, 0); }
  else if (act === 'loc') { view.loc = b.dataset.key; view.screen = 'list'; view.q = ''; saveNav(); render(); window.scrollTo(0, 0); }
  else if (act === 'sync') await withBusy('送信・更新しています…', async () => { await sync(); if (ready()) await refresh(); });
  else if (act === 'connect') {
    let parsed = { api: cfg && cfg.api, key: '' };
    const codeEl = $('#s-code');
    if (codeEl) {
      const raw = codeEl.value.trim();
      parsed = parseSetupCode(raw);
      // 途中で切れている等の調査用に、貼り付けた文字数と先頭を表示する
      const bad = () => alert(`設定コードが正しくありません。もう一度コピーして貼り付けてください。\n（貼り付けた文字数：${raw.length}、先頭：${raw.slice(0, 10)}…）\n正しいコードは「KENSA1:」で始まる約170文字です。`);
      if (!parsed || !/^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(parsed.api)) return bad();
    }
    const key = normKey($('#s-key').value) || parsed.key;
    if (!key) return alert('合言葉を入力してください。');
    const conn = { api: parsed.api, key, name: '' };
    try {
      const j = await withBusy('接続しています…', () => api('hello', {}, conn));
      cfg = conn;
      store.set('cfg', cfg);
      names = j.names;
      store.set('names', names);
      render();
    } catch (err) { alert(err.message); }
  }
  else if (act === 'resetconn') {
    if (Object.values(drafts).some(d => d.pending)) return alert('未送信のデータがあります。送信してからやり直してください。');
    if (!confirm('接続設定を消して、設定コードの貼り付けからやり直します。よろしいですか？')) return;
    cfg = null; store.set('cfg', cfg); render();
  }
  else if (act === 'pickname') { cfg.name = b.dataset.name; store.set('cfg', cfg); await withBusy('読み込み中…', () => refresh(true)); render(); sync(); }
  else if (act === 'logout') {
    if (Object.values(drafts).some(d => d.pending)) return alert('未送信のデータがあります。送信してから変更してください。');
    cfg.name = ''; store.set('cfg', cfg); render();
  }
  else if (act === 'filter') { view.filter = b.dataset.f; store.set('filter', view.filter); render(); }
  else if (act === 'refresh') withBusy('更新しています…', () => refresh());
  else if (act === 'open') { view.from = view.screen; view.screen = 'detail'; view.id = b.dataset.id; view.details = false; view.partsEdit = false; view.testsEdit = false; view.showMissing = false; render(); window.scrollTo(0, 0); }
  else if (act === 'start') startWork(false);
  else if (act === 'reopen') { if (confirm('完了済みの機器を修正のため再開します。よろしいですか？')) startWork(true); }
  else if (act === 'release') releaseWork();
  else if (act === 'force') forceRelease();
  else if (act === 'finish') finishWork();
  else if (act === 'insp') toggleInspector(b.dataset.name);
  else if (act === 'worker') setWorker(b.dataset.name);
  else if (act === 'details') { view.details = !view.details; renderDetail(); }
  else if (act === 'jst') showJst();
  else if (act === 'pvna') {
    const path = b.dataset.path;
    editDraft(data => {
      if (data.pv.na[path]) { delete data.pv.na[path]; return; }
      data.pv.na[path] = true;
      const ks = path.split('.');
      if (ks.length === 3) data.pv[ks[1]][ks[2]] = ''; else data.pv[ks[1]] = '';
      removePvToken(getDev(view.id), data, path);
    });
  }
  else if (act === 'manual') { const d = getDev(view.id); if (d) showManual(d); }
  else if (act === 'resetdata') resetData();
  else if (act === 'partsedit') {
    editDraft(data => {
      if (!data.partsEdited || !Array.isArray(data.parts)) {
        data.parts = clone(getDev(view.id).info.prev.parts || []).map(p => ({ name: p.name || '', qty: p.qty == null ? '' : String(p.qty), kind: p.kind || '' }));
        data.partsEdited = true;
      }
      view.partsEdit = true;
    });
  }
  else if (act === 'partsdone') {
    editDraft(data => {
      view.partsEdit = false;
      data.parts = data.parts.filter(p => String(p.name || '').trim() || String(p.qty || '').trim());
      // 結果が報告書と同じなら「変更なし」に戻す（Excel には書かない）
      const orig = (getDev(view.id).info.prev.parts || []).map(p => [p.name || '', p.qty == null ? '' : String(p.qty), p.kind || '']);
      if (JSON.stringify(data.parts.map(p => [p.name || '', String(p.qty == null ? '' : p.qty), p.kind || ''])) === JSON.stringify(orig)) {
        data.partsEdited = false;
        data.parts = null;
      }
    });
  }
  else if (act === 'partsreset') {
    if (!confirm('使用部品の変更を取り消して、報告書の内容に戻します。よろしいですか？')) return;
    editDraft(data => { data.partsEdited = false; data.parts = null; data.replaced = {}; view.partsEdit = false; });
  }
  else if (act === 'addpart') editDraft(data => { data.parts.push({ name: '', qty: '', kind: '' }); });
  else if (act === 'delpart') {
    editDraft(data => {
      const n = +b.dataset.n;
      data.parts.splice(n, 1);
      // 「交換済み」の目印を、詰めた後の行番号に合わせる
      const r = {};
      Object.keys(data.replaced).forEach(k => { if (+k < n) r[k] = true; else if (+k > n) r[+k - 1] = true; });
      data.replaced = r;
    });
  }
  else if (act === 'fieldedit') editField(b.dataset.key);
  else if (act === 'fieldok') editDraft(data => { const k = b.dataset.key; data.fields[k] = Object.assign({}, data.fields[k], { ok: !(data.fields[k] && data.fields[k].ok) }); });
  else if (act === 'replaced') {
    editDraft(data => {
      const n = b.dataset.n;
      if (data.replaced[n]) delete data.replaced[n]; else data.replaced[n] = true;
      applyReplaced(getDev(view.id), data, n, !!data.replaced[n]);
    });
  }
  else if (act === 'testsedit') { view.testsEdit = !view.testsEdit; renderDetail(); }
  else if (act === 'savememo') saveMemo(false);
  else if (act === 'savedevmemo') saveDevMemo(false);
  else if (act === 'flag') toggleFlag();
  else if (act === 'gonote') { const c = $('#devmemo-card'); if (c) c.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
  else if (act === 'usetemp') { const t = store.get('lastTemp', null); if (t) editDraft(data => { data.temp = t.v; }); }
});

function onEdit(e) {
  const t = e.target;
  if (t.id === 'q') {
    if (e.isComposing) return;  // 日本語の変換中は確定（compositionend）まで待つ
    view.q = t.value;
    const r = $('#results');
    if (r) r.innerHTML = listResults(listScope());
    return;
  }
  if (t.id === 'memo') {
    memoDrafts[view.plant] = t.value;
    store.set('memoDrafts', memoDrafts);
    const st = $('#memo-state');
    if (st) { const un = t.value !== ((memos[view.plant] || {}).text || ''); st.textContent = un ? '未保存' : ''; st.className = un ? 'ng' : ''; }
    return;
  }
  if (t.id === 'devmemo') {
    noteDrafts[view.id] = t.value;
    store.set('noteDrafts', noteDrafts);
    const st = $('#devmemo-state');
    if (st) { const un = t.value !== ((notes[view.id] || {}).text || ''); st.textContent = un ? '未保存' : ''; st.className = un ? 'ng' : ''; }
    return;
  }
  const k = t.dataset.k;
  if (!k || view.screen !== 'detail') return;
  const dr = drafts[view.id];
  if (!dr || t.disabled) return;
  setPath(dr.data, k, t.type === 'checkbox' ? t.checked : t.value);
  if (k.startsWith('tests.')) dr.data.testsEdited = true;
  if (k === 'temp') rememberTemp(getDev(view.id), t.value);  // 手で入力した温度だけを「最後に入力した温度」にする
  const clock = k.match(/^panels\.(\d+)\.clock(Dir|Min)$/);
  if (clock) {
    const p = dr.data.panels[clock[1]];
    p.items[2] = clockText(p);
    const pt = document.querySelector(`[data-ptext="${clock[1]}"]`);
    if (pt) pt.textContent = p.items[2];
  }
  touchDraft(view.id);
  if (t.type === 'checkbox' || (clock && clock[2] === 'Dir')) renderDetail();
  else if (k.startsWith('ch.')) updateDevs(getDev(view.id), dr.data);
  else if (k === 'note') { const np = $('#noteprev'); if (np) np.innerHTML = notePreview(getDev(view.id), dr.data.note); }
  else if (k.startsWith('pv.') || k.startsWith('clock.')) {
    if (k.startsWith('pv.')) applyPv(getDev(view.id), dr.data);
    else {
      applyClock(dr.data);
      const cn = $('#clock-now');
      if (cn) cn.textContent = clockNoteText(dr.data.clock) || '（有・無を選んでください）';
    }
    const ta = document.querySelector('textarea[data-k=note]');
    if (ta) ta.value = dr.data.note;
    const np = $('#noteprev');
    if (np) np.innerHTML = notePreview(getDev(view.id), dr.data.note);
  }
  if (view.showMissing) markMissing();
}
document.addEventListener('input', onEdit);
// iPhone の Safari は、タッチを受け取る処理が無いと「押している間」の見た目（:active）を出さない
document.addEventListener('touchstart', () => {}, { passive: true });
document.addEventListener('compositionend', e => { if (e.target.id === 'q') onEdit(e); });
document.addEventListener('change', e => { if (e.target.tagName === 'SELECT' || e.target.type === 'checkbox' || e.target.type === 'date') onEdit(e); });

// 数値キーボードにはマイナスや文字が無いため、キーボードの上に「±」「CLOSE」などのバーを出す
const kb = $('#kbbar');
const kbpre = $('#kbpre');
let activeNum = null;
// 「次へ」「前へ」の順番：測定値の表は UP を上から下へ、続けて DOWN を下から上へ。ほかの欄は画面の並びのまま
function navInputs() {
  const out = [];
  const done = new Set();
  document.querySelectorAll('input.num:not(:disabled)').forEach(el => {
    if (done.has(el)) return;
    const tbl = el.closest('table.pt');
    if (!tbl) { out.push(el); return; }
    const ins = [...tbl.querySelectorAll('input.num:not(:disabled)')];
    const ups = ins.filter(x => /\.(up|adjUp)\.\d+$/.test(x.dataset.k));
    const downs = ins.filter(x => /\.(down|adjDown)\.\d+$/.test(x.dataset.k)).reverse();
    [...ups, ...downs].forEach(x => { out.push(x); done.add(x); });
  });
  return out;
}

function placeKb() {
  const vv = window.visualViewport;
  const top = vv ? vv.offsetTop + vv.height - kb.offsetHeight : window.innerHeight - kb.offsetHeight;
  kb.style.top = top + 'px';
}
document.addEventListener('focusin', e => {
  if (!e.target.matches('input.num')) return;
  activeNum = e.target;
  const pre = (activeNum.dataset.presets || '').split(',').filter(Boolean);
  kbpre.innerHTML = pre.map(v => `<button type="button" data-kb="preset" data-v="${h(v)}">${h(v)}</button>`).join('');
  kb.hidden = false;
  placeKb();
});
document.addEventListener('focusout', () => setTimeout(() => {
  if (!document.activeElement || !document.activeElement.matches('input.num')) { kb.hidden = true; activeNum = null; }
}, 100));
if (window.visualViewport) {
  visualViewport.addEventListener('resize', placeKb);
  visualViewport.addEventListener('scroll', placeKb);
}
kb.addEventListener('pointerdown', e => e.preventDefault());  // 押してもキーボードを閉じない
kb.addEventListener('click', e => {
  const b = e.target.closest('[data-kb]');
  if (!b || !activeNum) return;
  const inputs = navInputs();
  const idx = inputs.indexOf(activeNum);
  const set = v => { activeNum.value = v; activeNum.dispatchEvent(new Event('input', { bubbles: true })); };
  if (b.dataset.kb === 'sign') {
    const v = activeNum.value.trim();
    set(v.startsWith('-') ? v.slice(1) : '-' + v);
  } else if (b.dataset.kb === 'preset') {
    set(b.dataset.v);
    if (inputs[idx + 1]) inputs[idx + 1].focus();
  } else if (b.dataset.kb === 'next' && inputs[idx + 1]) inputs[idx + 1].focus();
  else if (b.dataset.kb === 'prev' && inputs[idx - 1]) inputs[idx - 1].focus();
  else if (b.dataset.kb === 'done') activeNum.blur();
});

// ---- プレビュー（editor.html の中に埋め込む）----
//   編集画面から { type:'preview', config, device, names, mode } を受け取り、その設定でその機器の画面を出す（保存・送信はしない）
//   { type:'classify', config, devices } には、各機器の種類と手順画像のシリーズを返す（判定の計算をアプリと同じものにするため）
if (PREVIEW) {
  window.addEventListener('message', e => {
    if (e.origin !== location.origin || !e.data) return;
    const m = e.data;
    if (m.type === 'hello') sendReady();
    else if (m.type === 'preview') {
      appConfig = validConfig(m.config) || DEFAULT_CONFIG;
      names = (m.names && m.names.length) ? m.names : ['作業員'];
      cfg = { api: '', key: '', name: names[0] };
      const d = clone(m.device);
      if (m.mode === 'todo') { d.status = ST.TODO; d.worker = ''; d.data = null; drafts = {}; }
      else {
        d.status = ST.WORK; d.worker = cfg.name;
        drafts = { [d.id]: { data: normalize(d, null), rev: 0, pending: false } };
      }
      devices = [d];
      view = Object.assign(view, { screen: 'detail', id: d.id, from: 'list', details: !!m.details, partsEdit: false, testsEdit: false, showMissing: false });
      render();
      window.scrollTo(0, 0);
    } else if (m.type === 'classify') {
      const conf = validConfig(m.config) || DEFAULT_CONFIG;
      const saved = appConfig;
      appConfig = conf;
      const result = (m.devices || []).map(d => {
        const t = typeOf(d);
        const models = d.kind === KIND.TOUCH ? (d.info.panels || []).map(p => p.model) : [d.info && d.info.model];
        return { id: d.id, type: t.id, typeName: t.name, series: models.map(x => (seriesOf(x) || {}).key || '') };
      });
      appConfig = saved;
      e.source.postMessage({ type: 'classified', seq: m.seq, result }, MSG_TARGET);
    }
  });
  // 編集画面へ「準備ができた」と、アプリの初期値・要素の一覧などを送る（編集画面はこれを使うので、定義はアプリの中の1か所だけ）
  function sendReady() {
    if (window.parent !== window) {
      window.parent.postMessage({ type: 'previewReady', defaults: DEFAULT_CONFIG, showDef: SHOW_DEF, condFields: COND_FIELDS, condOps: COND_OPS, procs: MANUAL_PROCS, kinds: Object.values(KIND) }, MSG_TARGET);
    }
  }
  sendReady();
  $('#app').innerHTML = '<p class="muted" style="padding:16px">プレビューの準備中…</p>';
} else {
  render();
  if (ready()) { sync(); refresh(true); }
}
</script>
