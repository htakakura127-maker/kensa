<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="検査入力">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1f4e79">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>検査入力</title>
<style>
:root {
  --bg: #f3f5f8; --card: #fff; --ink: #1d2733; --sub: #5d6b7a; --line: #d5dbe3;
  --pri: #1f4e79; --pri-ink: #fff; --todo: #7d8995; --work: #c76a12; --done: #23804d; --ng: #c62828; --mine: #fff4e5;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 -apple-system, "Hiragino Sans", "Hiragino Kaku Gothic ProN", sans-serif; -webkit-text-size-adjust: 100%; }
button, input, select, textarea { font: inherit; color: inherit; }
header.top { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 8px; padding: calc(env(safe-area-inset-top) + 8px) 16px 8px; background: var(--pri); color: var(--pri-ink); }
header.top .ttl { flex: 1; min-width: 0; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
header.top button.back { background: none; border: 0; color: inherit; font-size: 17px; padding: 4px 8px 4px 0; white-space: nowrap; }
.net { font-size: 12px; padding: 3px 10px; border-radius: 99px; background: rgba(255,255,255,.2); border: 0; color: #fff; white-space: nowrap; }
.net.off { background: #b71c1c; }
.net.pend { background: #e08a00; }
main { padding: 12px 16px calc(env(safe-area-inset-bottom) + 96px); max-width: 760px; margin: 0 auto; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-bottom: 12px; }
h2 { font-size: 18px; margin: 0 0 10px; }
h3 { font-size: 16px; margin: 18px 0 6px; }
h3 small { font-weight: 400; color: var(--sub); font-size: 12px; }
label { display: block; min-width: 0; font-size: 13px; color: var(--sub); margin-bottom: 10px; }
label > input, label > select, label > textarea { display: block; width: 100%; min-width: 0; margin-top: 4px; }
input, select, textarea { font-size: 16px; padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px; background: #fff; min-height: 42px; min-width: 0; }
/* iOS の日付欄は既定の見た目だと幅が縮まず隣の欄に重なるため、見た目を解除して幅を効かせる */
input[type=date] { -webkit-appearance: none; appearance: none; width: 100%; }
input[type=date]::-webkit-date-and-time-value { text-align: left; }
input::placeholder { color: #b9c1cb; }
input:disabled, select:disabled, textarea:disabled { background: #f0f2f5; color: var(--ink); opacity: 1; -webkit-text-fill-color: var(--ink); }
textarea { min-height: 120px; resize: vertical; }
.btn { display: block; width: 100%; padding: 13px; border-radius: 10px; border: 1px solid var(--line); background: #fff; font-weight: 600; margin-top: 10px; }
.btn.primary { background: var(--pri); color: #fff; border-color: var(--pri); }
.btn.ok { background: var(--done); color: #fff; border-color: var(--done); }
.btn.warn { color: var(--ng); }
.btn.small { padding: 9px; font-size: 14px; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 0 10px; }
.muted { color: var(--sub); font-size: 13px; }
.notice { padding: 10px 12px; border-radius: 10px; margin-bottom: 12px; font-size: 14px; background: #fff; border: 1px solid var(--line); }
.notice.work { background: #fff1e0; border-color: #f0c58f; }
.notice.err { background: #fdecea; border-color: #f3b4ae; }
.notice.done { background: #e6f4ec; border-color: #a9d8bc; }
.filters { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 8px; }
.filters button { flex: none; border: 1px solid var(--line); background: #fff; border-radius: 99px; padding: 6px 12px; font-size: 14px; }
.filters button.on { background: var(--pri); color: #fff; border-color: var(--pri); }
.search { width: 100%; margin-bottom: 10px; }
.group { font-size: 13px; color: var(--sub); margin: 14px 0 6px; font-weight: 700; }
.item { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 6px; }
.item.mine { background: var(--mine); border-color: #f0c58f; }
.item .main { flex: 1; min-width: 0; }
.item .tag { font-weight: 700; }
.item .sub { font-size: 13px; color: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.badge { flex: none; font-size: 12px; font-weight: 700; color: #fff; padding: 3px 9px; border-radius: 99px; max-width: 45%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.st-todo { background: var(--todo); } .st-work { background: var(--work); } .st-done { background: var(--done); } .st-pend { background: #e08a00; }
.st-wait { background: #7b4fb8; } .st-temp { background: #2f6fa8; } .st-ng { background: var(--ng); }
/* 押したことが分かるよう、押している間は少し薄くする */
button:active, .btn:active, .menu:active, .item:active { opacity: .55; }
/* 右上の「更新中…」 */
.net.busyn { background: rgba(255,255,255,.35); }
.mini-spin { display: inline-block; width: 10px; height: 10px; margin-right: 5px; vertical-align: -1px; border: 2px solid rgba(255,255,255,.5); border-top-color: #fff; border-radius: 50%; animation: spin .8s linear infinite; }
/* 通信中の表示 */
.busy { position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.25); display: flex; align-items: center; justify-content: center; }
.busy .box { background: #fff; border-radius: 14px; padding: 18px 26px; display: flex; flex-direction: column; align-items: center; gap: 10px; font-weight: 700; }
.busy .spin { width: 34px; height: 34px; border: 4px solid #d5dbe3; border-top-color: var(--pri); border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
/* 未記入の強調（完了しようとしたとき） */
.missing { border: 2px solid var(--ng) !important; background-color: #fff5f5 !important; }
.names.pick.missing, .crow.missing { border-radius: 8px; padding: 4px; }
/* 日本標準時 */
.jst-time { font-size: 40px; font-weight: 700; text-align: center; font-variant-numeric: tabular-nums; letter-spacing: 1px; }
.jst-date { text-align: center; color: var(--sub); }
.jst-note { font-size: 12px; color: var(--sub); text-align: center; margin-top: 6px; }
/* PV（記事に反映）：2列。ラベルが長くても欄の高さがそろうよう、ラベルは1行に収める */
.pvcell { min-width: 0; font-size: 13px; color: var(--sub); margin-bottom: 10px; }
.pvcell input { display: block; width: 100%; margin-top: 4px; }
.pvhead { display: flex; align-items: center; gap: 4px; }
.pvhead span { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pvna { flex: none; padding: 2px 8px; border: 1px solid var(--line); border-radius: 99px; background: #fff; font-size: 12px; font-weight: 700; color: var(--sub); }
.pvna.on { background: var(--todo); border-color: var(--todo); color: #fff; }
/* 製造番号の読み方の例 */
.chint { font-size: 11px; color: var(--sub); padding: 0 0 6px 80px; margin-top: -2px; border-bottom: 1px solid var(--line); }
.crow.has-hint { border-bottom: 0; }  /* 製造番号と読み方の間には線を引かない */
/* 修正手順（画像） */
.modal.manual { align-items: stretch; }
.modal.manual .box { max-height: 100%; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.man-group { margin: 10px 0 14px; }
.man-title { font-weight: 700; color: var(--pri); }
.man-img { display: block; width: 100%; height: auto; margin: 8px 0; border: 1px solid var(--line); border-radius: 8px; }
dl.info { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 12px; margin: 8px 0 0; font-size: 14px; }
dl.info dt { color: var(--sub); }
dl.info dd { margin: 0; word-break: break-all; }
table.pt { width: 100%; table-layout: fixed; border-collapse: collapse; font-size: 14px; margin-bottom: 6px; }
table.pt caption { text-align: left; font-weight: 700; font-size: 13px; color: var(--sub); padding: 4px 0; }
table.pt th { font-size: 11px; line-height: 1.3; color: var(--sub); font-weight: 600; padding: 2px 1px; }
table.pt td { padding: 3px 2px; text-align: center; vertical-align: top; }
table.pt td.ref { color: var(--sub); font-size: 13px; padding-top: 12px; overflow: hidden; text-overflow: ellipsis; }
table.pt input { width: 100%; text-align: right; padding: 8px 5px; }
.dev { font-size: 11px; color: var(--sub); text-align: right; min-height: 14px; }
.dev.ng { color: var(--ng); font-weight: 700; }
/* 入力欄の下の小さい表示：1行目に前回値（入力しても消えない）、2行目に誤差。横に並べると狭い画面で重なるため縦に積む */
.hint { display: flex; flex-direction: column; font-size: 10.5px; line-height: 1.35; margin-top: 1px; }
.hint .prev { color: #8a96a3; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hint .dev { font-size: inherit; min-height: 0; text-align: right; white-space: nowrap; }
.hint .dev:empty { display: none; }
/* 選択ダイアログ（中断時など） */
.modal { position: fixed; inset: 0; z-index: 30; background: rgba(0,0,0,.45); display: flex; align-items: flex-end; justify-content: center; padding: 16px 16px calc(env(safe-area-inset-bottom) + 16px); }
.modal .box { width: 100%; max-width: 480px; background: #fff; border-radius: 14px; padding: 16px; }
.modal .msg { font-size: 15px; white-space: pre-wrap; margin-bottom: 6px; }
.modal .btn.warn { border-color: #f3b4ae; }
/* 工場・報告書のメニュー */
.sect { font-size: 14px; color: var(--sub); margin: 16px 0 8px; font-weight: 700; }
.menu { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-bottom: 8px; }
.menu .main { flex: 1; min-width: 0; }
.menu .name { font-weight: 700; font-size: 17px; }
.menu .sub { font-size: 12px; color: var(--work); }
.menu .chev { color: var(--sub); font-size: 20px; }
.prog { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
.prog .bar { flex: 1; height: 8px; border-radius: 99px; background: #e4e8ee; overflow: hidden; }
.prog .bar i { display: block; height: 100%; background: var(--done); }
.prog .cnt { font-size: 14px; font-weight: 700; min-width: 64px; text-align: right; }
.prog.full .cnt { color: var(--done); }
.chk { display: flex; align-items: center; gap: 8px; color: var(--ink); font-size: 15px; margin: 6px 0 12px; }
.chk input { width: 22px; height: 22px; min-height: 0; margin: 0; }
.names { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.names button { padding: 12px 4px; border: 1px solid var(--line); border-radius: 10px; background: #fff; font-size: 16px; }
/* 使用部品（表示のみ。フィルター類だけ「交換済み」の目印を付けられる） */
.part { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
.part .pn { flex: 1; min-width: 0; word-break: break-all; }
.part .pq { flex: none; color: var(--sub); font-size: 13px; white-space: nowrap; }
.part .xchg { flex: none; min-height: 36px; padding: 6px 12px; border: 1px solid var(--line); border-radius: 99px; background: #fff; font-size: 14px; font-weight: 700; color: var(--sub); }
.part .xchg.on { background: var(--done); border-color: var(--done); color: #fff; }
/* 詳細を表示（項目名の下に値を置き、横に並べない） */
.details { margin-top: 8px; border-top: 1px solid var(--line); }
.ditem { padding: 7px 0; border-bottom: 1px dashed var(--line); }
.ditem .dl { font-size: 12px; color: var(--sub); }
.ditem .dv { font-size: 15px; word-break: break-all; }
/* 共有メモ */
textarea.memo { display: block; width: 100%; min-height: 110px; }
.memoinfo { display: flex; justify-content: space-between; font-size: 12px; color: var(--sub); margin-top: 4px; }
.memoinfo .ng { color: var(--ng); font-weight: 700; }
/* フラグ：一覧の枠の左横に付箋（枠の大きさは変えず、左の余白にはみ出させる） */
.item { position: relative; }
/* 一覧の右側：状態の表示の下に点検シールのスイッチ */
.item .right { flex: none; display: flex; flex-direction: column; align-items: flex-end; gap: 5px; max-width: 45%; }
.item .right .badge { max-width: 100%; }
.seal { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; color: var(--sub); padding: 2px 0 2px 6px; }
.seal .sl { font-size: 10px; letter-spacing: -.02em; white-space: nowrap; }
.seal .track { position: relative; width: 34px; height: 19px; border-radius: 99px; background: #c4ccd4; transition: background .15s; }
.seal .knob { position: absolute; top: 2px; left: 2px; width: 15px; height: 15px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.3); transition: left .15s; }
.seal.on { color: var(--done); font-weight: 700; }
.seal.on .track { background: var(--done); }
.seal.on .knob { left: 17px; }
.item .flagtab { position: absolute; left: -12px; top: 7px; width: 14px; height: 26px; background: #f7c600; border-radius: 2px 0 0 2px; box-shadow: -1px 1px 2px rgba(0,0,0,.25); pointer-events: none; }
.ttlrow { display: flex; align-items: flex-start; gap: 8px; }
.ttlrow > div { flex: 1; min-width: 0; font-weight: 700; }
.flagbtn { flex: none; font-size: 13px; padding: 4px 10px; border-radius: 8px; border: 1px solid var(--line); background: #fff; color: var(--sub); }
.flagbtn.on { background: #fff3b0; border-color: #e0b400; color: #6b5300; font-weight: 700; }
.flagbtn.on::before { content: ''; display: inline-block; width: 7px; height: 13px; background: #f7c600; margin-right: 5px; vertical-align: -2px; }
.notepeek { display: block; width: 100%; text-align: left; background: #fffbe0; border: 1px solid #ecd56b; border-radius: 8px; padding: 6px 10px; margin-top: 8px; font-size: 13px; color: #5c4a00; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
/* 最後に入力した温度（流用） */
.lasttemp { display: flex; align-items: center; gap: 8px; margin: -4px 0 10px; font-size: 12px; color: var(--sub); }
.lasttemp span { flex: 1; min-width: 0; }
.lasttemp button { flex: none; padding: 6px 10px; border: 1px solid var(--pri); border-radius: 99px; background: #fff; color: var(--pri); font-size: 13px; font-weight: 700; }
/* 耐圧・漏洩・気密試験（ふだんはグレー表示） */
.vt { display: grid; grid-template-columns: minmax(0, 1fr) 64px 76px 56px; gap: 6px; align-items: center; margin-bottom: 6px; }
.vt.head span { font-size: 11px; color: var(--sub); text-align: center; }
.vt .vl { font-size: 12px; line-height: 1.25; }
.vt input, .vt select { padding: 6px 4px; min-height: 36px; font-size: 15px; }
.vt select { padding: 6px 2px; }
.vtests.off { opacity: .5; }
/* 使用部品の編集 */
.pedit { display: grid; grid-template-columns: minmax(0, 1fr) 56px 40px; gap: 6px; margin-bottom: 6px; }
.pedit.k { grid-template-columns: minmax(0, 1fr) 52px 70px 40px; }
.pedit input.num { text-align: right; }
.pedit .del { border: 1px solid var(--line); border-radius: 8px; background: #fff; color: var(--ng); font-size: 18px; }
/* 機器情報の確認（確認ボタン・変更ボタン） */
.crow { display: grid; grid-template-columns: 74px minmax(0, 1fr) 62px 50px; gap: 6px; align-items: center; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.crow .cl { color: var(--sub); font-size: 12px; }
.crow .cv { word-break: break-all; }
.crow .orig { font-size: 11px; color: var(--sub); text-decoration: line-through; }
.crow.changed .cv { background: #fff59d; border-radius: 4px; padding: 2px 4px; }
.crow button { min-height: 36px; padding: 4px 2px; border: 1px solid var(--line); border-radius: 8px; background: #fff; font-size: 13px; font-weight: 700; color: var(--sub); }
.crow .okbtn.on { background: var(--done); border-color: var(--done); color: #fff; }
.crow .edbtn { color: var(--pri); }
.crow .edbtn:disabled { color: #c3cad3; background: #f0f2f5; }
/* 検査・作業員（押した順に番号） */
.names.pick button.on { background: var(--pri); border-color: var(--pri); color: #fff; font-weight: 700; }
.names.pick button:disabled { opacity: 1; }
/* 記事の Excel での見え方 */
.noteprev { margin: -4px 0 12px; font-size: 12px; color: var(--sub); }
.noteprev ol { margin: 4px 0 0; padding-left: 2.2em; font-family: "Hiragino Kaku Gothic ProN", monospace; color: var(--ink); }
.noteprev li.over { color: var(--ng); }
.noteprev .ng { color: var(--ng); font-weight: 700; }
.panel { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 10px; }
.panel .pname { font-weight: 700; }
.pitem { display: grid; grid-template-columns: minmax(0, 1fr) 120px; gap: 8px; align-items: center; margin-top: 8px; font-size: 14px; }
.cfield { margin-top: 10px; }
.cfield .chk { margin-top: 0; }
.pclock { display: grid; grid-template-columns: minmax(0, 1fr) 120px; gap: 8px; align-items: center; margin-top: 6px; font-size: 14px; }
.ptext { font-size: 12px; color: var(--sub); margin-top: 4px; }
.photos { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; margin: 6px 0 10px; }
.photos > p { grid-column: 1 / -1; margin: 4px 0; }
.pthumb { padding: 0; border: 1px solid var(--line); border-radius: 8px; background: #f4f6f8; overflow: hidden; display: flex; flex-direction: column; }
.pthumb img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; }
.pthumb small { font-size: 10px; color: var(--sub); padding: 2px 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.photo-add { display: block; text-align: center; }
.photo-view .box { max-width: 100%; }
.photo-view .pv-img img { width: 100%; height: auto; display: block; border-radius: 6px; }
.clocksrc { margin-top: 8px; font-size: 14px; }
.clocksrc .names { grid-template-columns: repeat(2, minmax(0, 1fr)); margin-top: 4px; }
.clocksrc .names button { padding: 10px 4px; font-size: 15px; }
.clocksrc .names button.wait { opacity: .6; }
.actions { position: fixed; left: 0; right: 0; bottom: 0; z-index: 4; padding: 8px 16px calc(env(safe-area-inset-bottom) + 8px); background: rgba(243,245,248,.96); border-top: 1px solid var(--line); }
.actions .inner { max-width: 760px; margin: 0 auto; display: flex; gap: 8px; }
.actions .btn { margin: 0; }
#kbbar { position: fixed; left: 0; right: 0; z-index: 20; display: flex; flex-direction: column; gap: 6px; padding: 6px 8px; background: #d1d5db; }
#kbbar[hidden] { display: none; }
.kbrow { display: flex; gap: 6px; }
.kbrow:empty { display: none; }
#kbbar button { flex: 1; min-width: 0; padding: 10px 4px; border: 0; border-radius: 8px; background: #fff; font-size: 16px; font-weight: 700; white-space: nowrap; }
#kbpre button { background: #e8f0f8; color: var(--pri); }
</style>
</head>
<body>
<header class="top" id="top"></header>
<main id="app"></main>
<div id="kbbar" hidden>
  <div class="kbrow" id="kbpre"></div>
  <div class="kbrow">
    <button type="button" data-kb="sign">± 符号</button>
    <button type="button" data-kb="prev">↑ 前へ</button>
    <button type="button" data-kb="next">↓ 次へ</button>
    <button type="button" data-kb="done">閉じる</button>
  </div>
</div>
<script>
'use strict';
const $ = s => document.querySelector(s);
const h = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clone = o => JSON.parse(JSON.stringify(o));
const ST = { TODO: '未着手', WORK: '作業中', DONE: '完了' };
const KIND = { KEIKI: '計器', VALVE: '調節弁', TOUCH: 'タッチパネル' };

// プレビュー（編集画面 editor.html の中に埋め込んで表示する）：サーバーにも端末の保存領域にも一切触れない
const PREVIEW = new URLSearchParams(location.search).has('preview');
// 編集画面とのやり取りの宛先（同じサイトだけ。PCのファイルを直接開いたテストでは origin が "null" になるため *）
const MSG_TARGET = location.origin === 'null' ? '*' : location.origin;

// ---- 端末内保存（圏外でも入力が消えないよう、変更のたびに書き込む）----
//   プレビューでは本物の入力途中データを壊さないよう、メモリの中だけに置く
const memStore = {};
const store = PREVIEW ? {
  get(k, d) { return k in memStore ? clone(memStore[k]) : d; },
  set(k, v) { memStore[k] = clone(v); },
} : {
  get(k, d) { try { const v = localStorage.getItem('kensa.' + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },

  if (PREVIEW) throw Object.assign(new Error('プレビューでは保存・送信はしません'), { code: 'preview' });
  const c = conn || cfg;
  if (!c || !c.api || !c.key) throw Object.assign(new Error('初期設定が済んでいません'), { code: 'config' });
  let res;
  try {
    // Content-Type を付けない（text/plain）ことで、事前確認なしで Apps Script に送れる
    res = await fetch(c.api, { method: 'POST', body: JSON.stringify(Object.assign({ action, key: c.key, name: c.name }, body)) });
  } catch (e) {
    setOnline(false);
    throw Object.assign(new Error('通信できません（圏外の可能性があります）'), { code: 'offline' });
  }
  setOnline(true);
  let j;
  try { j = await res.json(); } catch (e) { throw Object.assign(new Error('サーバーの応答が読めません。設定コードが古い可能性があります'), { code: 'bad' }); }
  checkReset(j.resetId);
  if (!j.ok) {
    // 保存済みの合言葉が通らない＝合言葉が変更された。入力中のデータは残したまま再設定してもらう
    if (j.code === 'auth' && !conn && cfg && cfg.key) {
      cfg.key = '';
      store.set('cfg', cfg);
      setTimeout(() => { alert('合言葉が変更されました。新しい合言葉を入力してください（入力中のデータは残っています）。'); render(); }, 0);
    }
    throw Object.assign(new Error(j.error), { code: j.code });
  }
  return j;
}

// 事務所でデータが初期化されたら（resetId が変わったら）、端末内の入力途中データを捨てる。
// 残しておくと、テスト時の値が初期化後のサーバーへ送られてしまうため
function checkReset(resetId) {
  if (resetId === undefined) return;
  const known = store.get('resetId', null);
  if (known === resetId) return;
  store.set('resetId', resetId);
  if (!resetId) return;
  // resetId は「日時|工場名」。工場名があればその工場の分だけ、無ければすべて捨てる
  const plant = String(resetId).split('|')[1] || '';
  const ids = Object.keys(drafts).filter(id => { const d = getDev(id); return !plant || !d || plantOf(d) === plant; });
  if (ids.length) {
    ids.forEach(id => delete drafts[id]);
    saveDrafts();
    renderNet();
    setTimeout(() => { alert(`${plant || '全工場'}のデータが初期化されました。この端末に残っていた入力途中のデータは消去しました。`); render(); }, 0);
  }
}

// 通信中の表示（作業開始など、画面が変わるまで時間がかかる操作で「押せたか」分かるように）
async function withBusy(label, fn) {
  const el = document.createElement('div');
  el.className = 'busy';
  el.innerHTML = `<div class="box"><div class="spin"></div><div>${h(label)}</div></div>`;
  document.body.appendChild(el);
  try { return await fn(); } finally { el.remove(); }
}

// 設定コード「KENSA1:<base64>」を { api, key } に戻す。URLだけを貼った場合はそのまま使う
// チャット経由のコピーで混ざりやすい改行・空白・見えない文字・全角コロン・前後の文章は無視する
function parseSetupCode(raw) {
  const s = raw.replace(/[\s ​-‍⁠　﻿]/g, '');
  const m = s.match(/KENSA1[:：]([A-Za-z0-9_\-+/]+=*)/i);
  if (!m) return { api: s, key: '' };
  try {
    const o = JSON.parse(atob(m[1].replace(/-/g, '+').replace(/_/g, '/')));
    return { api: o.u, key: o.k || '' };
  } catch (e) {
    return null;
  }
}

// 合言葉の表記ゆれを吸収する（「abcd-2345」のハイフン、空白、大文字、全角）
const normKey = v => v.replace(/[Ａ-Ｚａ-ｚ０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0))
  .replace(/[\s\-‐－ー―]/g, '').toLowerCase();

function setOnline(v) { online = v; renderNet(); }

function updateDevice(d) {
  const i = devices.findIndex(x => x.id === d.id);
  if (i >= 0) devices[i] = d; else devices.push(d);
  store.set('devices', devices);
}

// 通信中（一覧の取得・送信）の数。右上の表示を「更新中…」にする
let netBusy = 0;
async function netTask(fn) {
  netBusy++;
  renderNet();
  try { return await fn(); } finally { netBusy--; renderNet(); }
}

async function refresh(quiet) {
  try {
    const j = await netTask(() => api('list', {}));
    // 一覧を取りに行っている間に、この端末で送信・作業開始などをして新しくなった機器は、届いた古い内容で戻さない
    //   （送信した直後に「作業中」に戻って見える不具合の対策。updatedAt は「yyyy-MM-dd HH:mm:ss.SSS」なので文字で比べられる）
    const mineNow = new Map(devices.map(d => [d.id, d]));
    devices = j.devices.map(d => { const m = mineNow.get(d.id); return m && String(m.updatedAt || '') > String(d.updatedAt || '') ? m : d; });
    fetchedAt = j.now;
    if (j.memos) { memos = j.memos; store.set('memos', memos); }
    if (j.notes) {
      // 点検シール：一覧を取りに行っている間に押したものは、届いた古い内容で戻さない。
      //   残すのは「送信中」か「サーバーが一覧を作った時刻（j.now）より後に記録されたもの」だけ
      //   （それ以外はサーバーの内容に従う。ほかの人が外した・初期化で外れた、も正しく反映するため）
      const old = notes;
      notes = j.notes;
      Object.keys(old).forEach(id => {
        const o = old[id], n = notes[id] || {};
        if (o && (o.sealPending || (o.sealAt && String(o.sealAt) > String(j.now || '')))) notes[id] = Object.assign({}, n, { seal: o.seal, sealAt: o.sealAt, sealBy: o.sealBy, sealPending: o.sealPending });
        // タッチパネル時刻の元も同じ考え方（送信中・一覧より後に記録したものだけ残す）
        if (o && ((o.clockSrcPending && Object.keys(o.clockSrcPending).length) || (o.clockSrcAt && String(o.clockSrcAt) > String(j.now || '')))) notes[id] = Object.assign({}, notes[id] || {}, { clockSrc: o.clockSrc, clockSrcAt: o.clockSrcAt, clockSrcBy: o.clockSrcBy, clockSrcPending: o.clockSrcPending });
      });
      store.set('notes', notes);
    }
    if (j.archives) { archives = j.archives; store.set('archives', archives); }
    if (j.photoCount) { photoCount = j.photoCount; store.set('photoCount', photoCount); }
    if (j.manualImgs) { manualImgs = j.manualImgs; store.set('manualImgs', manualImgs); }
    // 設定（機器種類など）。サーバーに設定が無い・古いサーバー・使えない形なら初期値を使う
    if ('config' in j) {
      const c = validConfig(j.config);
      appConfig = c || DEFAULT_CONFIG;
      store.set('config', c);
    }
    store.set('devices', devices);
    store.set('fetchedAt', fetchedAt);
    if (j.names && j.names.length) {
      names = j.names;
      store.set('names', names);
      // 名簿から外れた名前のままなら選び直してもらう（未送信があれば送信を優先）
      if (cfg && cfg.name && !names.includes(cfg.name) && !Object.values(drafts).some(d => d.pending)) {
        alert(`名簿に「${cfg.name}」がありません。名前を選び直してください。`);
        cfg.name = '';
        store.set('cfg', cfg);
        render();
        return;
      }
    }
  } catch (e) {
    if (!quiet) alert(e.message);
  }
  // 過去点検データの機器画面は、自動更新で作り直さない（見ている途中で画面が動かないように）
  if (view.screen !== 'detail' && view.screen !== 'archDetail') render();
  // 開いている機器が一覧から無くなった（ほかの人が点検完了にした等）ときは、一覧へ戻す
  else if (view.screen === 'detail' && !getDev(view.id)) render();
}

// 未送信の入力を順に送る。失敗しても端末に残し、次の機会に再送する
async function sync() {
  if (PREVIEW || syncing || !ready()) return;
  syncing = true;
  let needRefresh = false;
  let closedId = null;
  try {
    for (const id of Object.keys(drafts)) {
      const dr = drafts[id];
      if (!dr || !dr.pending || dr.blocked) continue;  // 送信中に初期化で消された下書きは飛ばす
      const rev = dr.rev;
      try {
        // lock：作業開始のときの番号（startedAt）。別の端末（同じ名前）で開始し直されていたら、サーバーが受け付けない
        const sentJson = JSON.stringify(dr.data);
        const j = await netTask(() => api('save', { id, data: dr.data, finish: !!dr.finish, lock: dr.lock || '' }));
        updateDevice(j.device);
        // サーバーに届いた内容（次に作業開始するとき、サーバーがほかの人に変えられたかを比べる基準）
        if (drafts[id]) { drafts[id].base = j.device.updatedAt; drafts[id].sentJson = sentJson; }
        const cur = drafts[id];
        if (cur && cur.rev === rev) {
          if (cur.finish) delete drafts[id]; else cur.pending = false;
        }
        saveDrafts();
        if (!drafts[id] && view.screen === 'detail' && view.id === id) closedId = id;  // 開いている機器の下書きが無くなった
      } catch (e) {
        if (['offline', 'busy', 'bad', 'auth', 'config', 'blocked'].includes(e.code)) break;
        if (drafts[id] !== dr) continue;  // 初期化で消された下書き
        dr.blocked = e.message;  // ロックを失った等。データは残してユーザーに知らせる
        saveDrafts();
        needRefresh = true;      // ほかの人が完了させた等、サーバーの今の状態を取り直す（「修正のため再開」などのボタンを正しくするため）
      }
    }
  } finally {
    syncing = false;
    renderNet();
    if (ready() && view.screen !== 'detail') render();
  }
  if (needRefresh) {
    await refresh(true);
    if (view.screen === 'detail') renderDetail();  // 開いている画面のボタン（作業を再開／修正のため再開）を今の状態に
  } else if (closedId && view.screen === 'detail' && view.id === closedId && !finishing) {
    renderDetail();  // 送信が済んで下書きが無くなった機器の画面を、今の状態（完了など）にする
  }
}
let finishing = false;  // 「完了して送信」の処理中（その間は画面を作り直さない。終わったら一覧へ戻る）

function scheduleSync(ms) {
  clearTimeout(syncTimer);
  syncTimer = setTimeout(sync, ms);
}

setInterval(async () => {
  if (PREVIEW || !ready()) return;
  await sync();
  if (view.screen !== 'detail' && document.visibilityState === 'visible') refresh(true);
}, 30000);
window.addEventListener('online', () => sync());
document.addEventListener('visibilitychange', () => { if (!PREVIEW && document.visibilityState === 'visible' && ready()) { sync(); if (view.screen !== 'detail') refresh(true); } });

// ---- データ ----
function emptyCh() { return { up: ['', '', '', '', ''], down: ['', '', '', '', ''], adj: false, adjUp: ['', '', '', '', ''], adjDown: ['', '', '', '', ''] }; }

function normalize(d, data) {
  const prev = d.info.prev || {};
  const base = { date: today(), temp: '', note: (prev.note || []).join('\n'), worker: cfg.name, inspectors: [], replaced: {}, fields: {} };
  if (d.kind === KIND.KEIKI) Object.assign(base, { result: '合格' });
  if (d.kind === KIND.VALVE) Object.assign(base, { judge: '良好', result: '合格' });
  const out = Object.assign(base, data || {});
  // 旧版のデータ（押した順に右詰めで全員）は、一番右を作業員、残りを右から順に検査員として読み替える
  if (data && !('worker' in data) && Array.isArray(data.inspectors) && data.inspectors.filter(Boolean).length) {
    const arr = data.inspectors.filter(Boolean);
    out.worker = arr.pop();
    out.inspectors = arr.reverse();
  }
  out.worker = out.worker || '';
  out.inspectors = (out.inspectors || []).filter(n => n && n !== out.worker).slice(0, MAX_STAMPS - 1);
  out.replaced = out.replaced || {};
  out.fields = out.fields || {};
  out.pv = Object.assign({ filter: '', bias: '' }, out.pv);
  out.pv.v = Array.isArray(out.pv.v) ? out.pv.v : [];
  out.pv.b = Array.isArray(out.pv.b) ? out.pv.b : [];
  out.pv.na = out.pv.na || {};
  out.clock = Object.assign({ done: '', dir: '遅れ', amount: '', unit: '分' }, out.clock);
  out.custom = Object.assign({}, out.custom);  // 追加した要素の入力値（id → 値）
  out.tests = VALVE_TESTS.map((_, i) => Object.assign({ p: '', t: '', j: '' }, (out.tests || [])[i] || {}));
  out.ch = (d.info.chs || []).map((_, k) => Object.assign(emptyCh(), ((data && data.ch) || [])[k] || {}));
  if (d.kind === KIND.TOUCH) {
    out.panels = (d.info.panels || []).map((_, b) => Object.assign(
      { items: ['良好', '良好', CLOCK_OK, '良好'], clockDir: CLOCK_OK, clockMin: '' }, ((data && data.panels) || [])[b] || {}));
    // 以前の版の「良好」は「ズレなし」に読み替える
    out.panels.forEach(p => {
      if (p.clockDir === '良好') p.clockDir = CLOCK_OK;
      if (p.items[2] === '良好') p.items[2] = CLOCK_OK;
    });
  }
  return out;
}

// 検査・作業員の欄（報告書の印影の枠）の数
const MAX_STAMPS = 5;
// タッチパネルの時計が合っていたときの表記（選択肢と報告書の検査結果）
const CLOCK_OK = 'ズレなし';
// 記事1行に入る文字数（半角=1、全角=2）。新しい登録データには機器ごとに入っている
const DEFAULT_NOTE_CAPS = Array(10).fill(62);
const isHalf = c => (c >= 0x20 && c <= 0x7E) || (c >= 0xFF61 && c <= 0xFF9F);

// 記事を Excel の記事欄1行に収まる長さで折り返す（pc/common.ps1 の Split-NoteLines と同じ計算）
function splitNote(text, caps) {
  const lines = [];
  String(text || '').split(/\r?\n/).forEach(para => {
    if (!para.trim()) return;
    let cur = '', w = 0;
    for (let i = 0; i < para.length; i++) {
      const cw = isHalf(para.charCodeAt(i)) ? 1 : 2;
      const cap = caps[Math.min(lines.length, caps.length - 1)];
      if (cur && w + cw > cap) { lines.push(cur); cur = ''; w = 0; }
      cur += para[i]; w += cw;
    }
    lines.push(cur);
  });
  return lines;
}

function notePreview(d, text) {
  const caps = d.info.noteCaps || DEFAULT_NOTE_CAPS;
  const lines = splitNote(text, caps);
  const over = lines.length - caps.length;
  return `Excelの記事欄（${caps.length}行）での見え方：長い行は自動で折り返します
    ${lines.length ? `<ol>${lines.map((l, n) => `<li class="${n >= caps.length ? 'over' : ''}">${h(l)}</li>`).join('')}</ol>` : ''}
    ${over > 0 ? `<div class="ng">記事欄に入りきりません（${over} 行はみ出しています）。はみ出した分はExcelに書き込まれません。</div>` : ''}`;
}

// ---- 温度の流用。この iPhone で最後に手入力した温度（値・時刻・場所）を覚えておき、別の機器で「この温度を使う」で入れられる ----
function rememberTemp(d, v) {
  if (!String(v).trim()) return;
  store.set('lastTemp', { v: String(v).trim(), at: Date.now(), loc: (d.info && d.info.loc) || '', tag: d.tag || '' });
}
// 今からどれだけ前か（12分前、1時間5分前、2日前）
function agoText(ms) {
  const min = Math.max(0, Math.floor((Date.now() - ms) / 60000));
  if (min < 1) return '1分以内';
  if (min < 60) return `${min}分前`;
  if (min < 24 * 60) return `${Math.floor(min / 60)}時間${min % 60 ? (min % 60) + '分' : ''}前`;
  return `${Math.floor(min / (24 * 60))}日前`;
}

function lastTempBlock() {
  const t = store.get('lastTemp', null);
  if (!t) return '';
  return `<div class="lasttemp"><span>最後に入力した温度 <b>${h(t.v)}℃</b>（${h(agoText(t.at))}${t.loc ? '　' + h(t.loc) : ''}）</span>
    <button type="button" data-act="usetemp">この温度を使う</button></div>`;
}

// 「交換済み」ボタンを付ける部品（フィルター・パッキン・ガスケット類）
const isFilterPart = name => /ﾌｨﾙﾀ|フィルタ|ﾊﾟｯｷﾝ|パッキン|ｶﾞｽｹｯﾄ|ガスケット/.test(name || '');
const partsOf = (d, data) => (data.partsEdited && Array.isArray(data.parts) ? data.parts : ((d.info.prev || {}).parts || []));
const escRe = s => String(s).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');

// 「交換済み」は記事には書かない（2026-11-12 から。交換したかどうかは PC の「交換・変更点の一覧」に出す）。
//   data.replaced[行] に押した日（yyyy-MM-dd）を入れる（前の版は true）。下の applyReplaced は前の版の記事の書き方の参考に残す（呼ばない）
const replacedDate = () => today();
function applyReplaced(d, data, n, on) {
  const name = String((partsOf(d, data)[n] || {}).name || '').replace(/[\s　]+/g, '');
  if (!name) return;
  const re = new RegExp(`※${escRe(name)}交換実施。?(?:[（(][^）)]*[）)])?`);
  const lines = String(data.note || '') ? String(data.note).split('\n') : [];
  const i = lines.findIndex(l => re.test(l));
  if (on) {
    const t = new Date();
    const text = `※${name}交換実施(${t.getFullYear()}/${String(t.getMonth() + 1).padStart(2, '0')}/${String(t.getDate()).padStart(2, '0')})`;
    if (i >= 0) lines[i] = lines[i].replace(re, text); else lines.push(text);
  } else if (i >= 0) {
    const rest = lines[i].replace(re, '').replace(/^[\s　]+|[\s　]+$/g, '');
    if (rest) lines[i] = rest; else lines.splice(i, 1);
  }
  data.note = lines.join('\n');
}

// ---- 耐圧・漏洩・気密試験（調節弁）。ふだんは表示だけ（グレー）。「編集」を押すと入力でき、入力するとExcelに書く ----
const VALVE_TESTS = [
  { g: '耐圧試験', n: '水圧', u: 'min' }, { g: '耐圧試験', n: '空気圧', u: 'min' },
  { g: '漏洩試験', n: '水圧', u: 'min' }, { g: '漏洩試験', n: '空気圧', u: 'min' },
  { g: '漏洩試験', n: '許容漏洩量', u: 'L/min' }, { g: '漏洩試験', n: '実測漏洩量', u: 'L/min' },
  { g: '駆動部気密試験', n: '空気圧', u: 'min' },
];
function testsSection(d, data, editable) {
  const on = editable && view.testsEdit;
  const dis = on ? '' : 'disabled';
  const prev = d.info.prev.tests || [];
  return `<h3>耐圧・漏洩・気密試験 <small>${data.testsEdited ? '入力あり（Excelに書き込みます）' : 'ふだんは入力不要'}</small></h3>
    <div class="vtests ${on ? '' : 'off'}">
      <div class="vt head"><span></span><span>kPa</span><span>時間・量</span><span>判定</span></div>
      ${VALVE_TESTS.map((t, i) => {
        const v = data.tests[i] || {};
        const p = prev[i] || {};
        return `<div class="vt"><span class="vl">${t.n === '空気圧' || t.n === '水圧' ? h(t.g.replace('試験', '')) + '<br>' : ''}${h(t.n)}</span>
          <input class="num" inputmode="decimal" data-k="tests.${i}.p" value="${h(v.p)}" placeholder="${h(fmt(p.p))}" ${dis}>
          <input class="num" inputmode="decimal" data-k="tests.${i}.t" value="${h(v.t)}" placeholder="${h(fmt(p.t) ? fmt(p.t) + ' ' + t.u : t.u)}" ${dis}>
          <select data-k="tests.${i}.j" ${dis}>${opts(['', '良', '否'], v.j || '').replace('<option ', '<option value="" ').replace('></option>', '>－</option>')}</select></div>`;
      }).join('')}
    </div>
    ${editable ? `<button type="button" class="btn small" data-act="testsedit">${on ? '編集を終える' : '耐圧・漏洩・気密試験を編集'}</button>` : ''}`;
}

// 目視確認する機器情報（調節弁番号・型番・製造番号・製造年月）。現場で違っていたら変更できる
const checkName = (d, c) => (c.panel != null && d.info.panels && d.info.panels[c.panel] ? d.info.panels[c.panel].name + ' ' : '') + c.label;
const fieldOf = (data, c) => data.fields[c.key] || {};
const isChanged = (data, c) => { const f = fieldOf(data, c); return f.value != null && f.value !== c.value; };

// 型番が C で始まり製造番号が9桁の数字（アズビルの調節計など）のとき、製造番号の左4桁（年2桁＋週2桁）から製造時期を出す
//   例：1724 → 17_24/4 → 17年6月（17年24週）。月は 週÷4 を切り上げ（最大12月）
function serialDate(model, serial) {
  if (!/^[CＣ]/i.test(String(model).trim())) return '';
  const s = String(serial).trim();
  if (!/^\d{9}$/.test(s)) return '';
  const yy = s.slice(0, 2), ww = s.slice(2, 4);
  if (+ww < 1 || +ww > 53) return '';
  const month = Math.min(12, Math.ceil(+ww / 4));
  return `${s.slice(0, 4)}→${yy}_${ww}/4→${yy}年${month}月(${yy}年${+ww}週)`;
}

function checkRows(data, list, editable, d) {
  const dis = editable ? '' : 'disabled';
  const cur = c => (isChanged(data, c) ? fieldOf(data, c).value : c.value) || '';
  const model = list.find(x => x.key === 'model');
  const hint = !d || opt(d, 'serialHint');  // 製造時期の読み方を出すか（機器種類の設定）
  const hintOf = c => (hint && c.key === 'serial' && model ? serialDate(cur(model), cur(c)) : '');
  return list.map(c => {
    const f = fieldOf(data, c);
    const changed = isChanged(data, c);
    const hint = hintOf(c);
    return `<div class="crow ${changed ? 'changed' : ''} ${hint ? 'has-hint' : ''}">
      <div class="cl">${h(c.label)}</div>
      <div class="cv">${h((changed ? f.value : c.value) || '（空欄）')}${changed ? `<div class="orig">元：${h(c.value || '（空欄）')}</div>` : ''}</div>
      <button type="button" class="okbtn ${f.ok ? 'on' : ''}" data-act="fieldok" data-key="${h(c.key)}" ${dis}>${f.ok ? '✓ 確認' : '確認'}</button>
      <button type="button" class="edbtn" data-act="fieldedit" data-key="${h(c.key)}" ${editable && !f.ok ? '' : 'disabled'}>変更</button>
    </div>${hint ? `<div class="chint">${h(hint)}</div>` : ''}`;
  }).join('');
}

// 使用部品：ふだんは報告書（前年度）の内容を表示するだけ。「編集」を押すと変更でき、変更した内容がExcelに書き込まれる
//   フィルター類は交換したら「交換済み」を押す（見た目の確認用で報告書には書かない）
function partsSection(d, data, editable) {
  const dis = editable ? '' : 'disabled';
  const edited = !!data.partsEdited && Array.isArray(data.parts);
  const parts = edited ? data.parts : (d.info.prev.parts || []);
  const keiki = d.kind === KIND.KEIKI;
  const max = d.info.partsMax || 10;
  let html = `<h3>使用部品 <small>${edited ? '変更あり（Excelに書き込みます）' : '報告書の内容'}</small></h3>`;
  if (editable && view.partsEdit && edited) {
    html += parts.map((p, n) => `<div class="pedit ${keiki ? 'k' : ''}">
        <input data-k="parts.${n}.name" value="${h(p.name)}" placeholder="品名">
        <input class="num" inputmode="decimal" data-k="parts.${n}.qty" value="${h(p.qty)}" placeholder="数">
        ${keiki ? `<select data-k="parts.${n}.kind">${opts(['', '故障', '不良', '予防'], p.kind || '')}</select>` : ''}
        <button type="button" class="del" data-act="delpart" data-n="${n}" aria-label="削除">×</button></div>`).join('') +
      (parts.length < max ? `<button class="btn small" data-act="addpart">＋ 部品を追加（最大${max}件）</button>` : '') +
      `<button class="btn small primary" data-act="partsdone">編集を終える</button>
       <button class="btn small warn" data-act="partsreset">報告書の内容に戻す</button>`;
    return html;
  }
  html += (parts.length ? '' : '<p class="muted">なし</p>') + parts.map((p, n) => {
    const done = !!data.replaced[n];
    return `<div class="part"><span class="pn">${h(p.name)}</span>
      <span class="pq">${p.qty != null && p.qty !== '' ? h(fmt(p.qty)) + ' 個' : ''}${p.kind ? '　' + h(p.kind) : ''}</span>
      ${isFilterPart(p.name) && opt(d, 'replaced') ? `<button type="button" class="xchg ${done ? 'on' : ''}" data-act="replaced" data-n="${n}" ${dis}>${done ? '✓ 交換済み' : '交換済み'}</button>` : ''}
    </div>`;
  }).join('');
  if (editable) html += `<button class="btn small" data-act="partsedit">使用部品を編集</button>`;
  return html;
}

// ---- PVフィルタ・PVバイアス・検査時PV（計器）。入力すると記事の該当箇所に反映する ----
//   記事に「PVﾌｨﾙﾀ：0.0」等があれば値だけ書き換え、無ければ PV の行（無ければ先頭の新しい行）に足す
//   2CH以上の計器は、PVバイアスと検査時PVを CH ごとに入れる（記事では「CH1：…　PVﾊﾞｲｱｽ：0.0」の行、「検査時PV（CH1）：」）
const nChOf = d => (d.info.chs || []).length || 1;
function pvItems(d) {
  const n = nChOf(d);
  const unit = k => ((d.info.chs || [])[k] || {}).unitDisp || '';
  const items = [{ key: 'filter', path: 'pv.filter', label: 'PVフィルタ' }];
  if (n === 1) {
    items.push({ key: 'bias', k: 0, path: 'pv.bias', label: 'PVバイアス' });
    items.push({ key: 'pv', k: 0, path: 'pv.v.0', label: '検査時PV', unit: unit(0) });
  } else {
    for (let k = 0; k < n; k++) {
      items.push({ key: 'bias', k, path: `pv.b.${k}`, label: `PVバイアス CH${k + 1}` });
      items.push({ key: 'pv', k, path: `pv.v.${k}`, label: `検査時PV CH${k + 1}`, unit: unit(k) });
    }
  }
  // 機器種類の設定で出さない項目（PVフィルタ・PVバイアス・検査時PV）は除く（記事にも反映しない）
  const on = { filter: opt(d, 'pvFilter'), bias: opt(d, 'pvBias'), pv: opt(d, 'pvValue') };
  return items.filter(it => on[it.key]);
}
const getPath = (obj, path) => path.split('.').reduce((o, k) => (o == null ? o : o[k]), obj);
const pvInput = (data, it) => String(getPath(data, it.path) || '').trim();
const pvTokenValue = t => t.slice(t.indexOf('：') + 1);

// 記事の行の中から、その項目の「ラベル：値」を探す。{ i: 行番号, token } か null
function findPvToken(lines, it, n) {
  const find = (re, lineOk) => {
    for (let i = 0; i < lines.length; i++) {
      if (lineOk && !lineOk(lines[i])) continue;
      const m = lines[i].match(re);
      if (m) return { i, token: m[0] };
    }
    return null;
  };
  const ch = it.k + 1;
  if (it.key === 'filter') return find(/PVﾌｨﾙﾀｰ?：[^\s　]*/);
  if (it.key === 'bias') {
    if (n === 1) return find(/PVﾊﾞｲｱｽ：[^\s　]*/);
    return find(/PVﾊﾞｲｱｽ：[^\s　]*/, l => new RegExp(`^[\\s　]*CH${ch}[：:]`).test(l)) ||
      find(new RegExp(`PVﾊﾞｲｱｽ[（(]CH${ch}[）)]：[^\\s　]*`));
  }
  return n === 1 ? find(/検査時PV(?:[（(]CH1[）)])?：[^\s　]*/) : find(new RegExp(`検査時PV[（(]CH${ch}[）)]：[^\\s　]*`));
}

function pvFields(d, data, editable) {
  const dis = editable ? '' : 'disabled';
  const prevLines = d.info.prev.note || [];
  const n = nChOf(d);
  const cells = pvItems(d).map(it => {
    const f = findPvToken(prevLines, it, n);
    const prev = f ? pvTokenValue(f.token) : '';
    const na = !!data.pv.na[it.path];
    // 「不要」：その機器に無い項目。押すと入力できなくなり、記事にも書かない（記事にあれば消す）
    // 2CH以上は「不要」ボタンと並ぶと単位まで入らないため、単位は下の「前回」の表示に任せる
    return `<div class="pvcell"><div class="pvhead"><span>${h(it.label)}${it.unit && n === 1 ? ` (${h(it.unit)})` : ''}</span>
        <button type="button" class="pvna ${na ? 'on' : ''}" data-act="pvna" data-path="${it.path}" ${dis}>${na ? '✓ 不要' : '不要'}</button></div>
      <input class="num" inputmode="decimal" data-k="${it.path}" value="${na ? '' : h(pvInput(data, it))}" placeholder="${na ? '不要' : h(prev.replace(/[^\d.+\-]/g, ''))}" ${na ? 'disabled' : dis}>
      <div class="hint"><span class="prev">${prev ? '前回 ' + h(prev) : ''}</span></div></div>`;
  });
  // 2CH以上は「PVバイアス CHn」「検査時PV CHn」を1行に並べる（PVフィルタの横を空ける）
  if (n > 1 && opt(d, 'pvFilter') && opt(d, 'pvBias') && opt(d, 'pvValue')) cells.splice(1, 0, '<div></div>');
  return `<div class="grid2 pv">${cells.join('')}</div><p class="muted" style="margin:-4px 0 8px">PV の値は入力すると記事に反映されます。機器に無い項目は「不要」を押してください。</p>`;
}

// 「不要」にした項目を記事から消す（「CH1：…　PVﾊﾞｲｱｽ：0.0」なら PVﾊﾞｲｱｽ の部分だけ。行が空になれば行ごと）
function removePvToken(d, data, path) {
  const it = pvItems(d).find(x => x.path === path);
  const lines = String(data.note || '') ? String(data.note).split('\n') : [];
  const f = it && findPvToken(lines, it, nChOf(d));
  if (!f) return;
  const rest = lines[f.i].replace(f.token, '').replace(/[\s　]{2,}/g, '　').replace(/^[\s　]+|[\s　]+$/g, '');
  if (rest) lines[f.i] = rest; else lines.splice(f.i, 1);
  data.note = lines.join('\n');
}

function applyPv(d, data) {
  const n = nChOf(d);
  const lines = String(data.note || '') ? String(data.note).split('\n') : [];
  const add = [];
  pvItems(d).forEach(it => {
    const v = pvInput(data, it);
    if (!v || data.pv.na[it.path]) return;
    const f = findPvToken(lines, it, n);
    if (f) {
      const label = f.token.slice(0, f.token.indexOf('：'));
      const unit = pvTokenValue(f.token).replace(/^[-+]?[\d.]*/, '');  // 「16.3℃」の ℃ など、元の書き方を残す
      lines[f.i] = lines[f.i].replace(f.token, `${label}：${v}${unit}`);
    } else {
      const label = it.key === 'filter' ? 'PVﾌｨﾙﾀ' : it.key === 'bias' ? (n > 1 ? `PVﾊﾞｲｱｽ（CH${it.k + 1}）` : 'PVﾊﾞｲｱｽ')
        : (n > 1 ? `検査時PV（CH${it.k + 1}）` : '検査時PV');
      add.push(`${label}：${v}${it.unit || ''}`);
    }
  });
  if (add.length) {
    const i = lines.findIndex(l => /PVﾌｨﾙﾀ|PVﾊﾞｲｱｽ|検査時PV/.test(l));
    if (i >= 0) lines[i] = lines[i].replace(/[\s　]+$/, '') + '　' + add.join('　');
    else lines.unshift(add.join('　'));
  }
  data.note = lines.join('\n');
}

// ---- 記録計の時刻合わせ。選ぶと記事の「時刻合わせ」の文を書き換える（無ければ最後に1行足す）----
const CLOCK_NOTE_RE = /※?時刻合わせ(?:実施|無し)。?(?:[（(][^）)]*[）)])?|※?時計設定\d+(?:分|秒)(?:遅れ|進み)/;
function clockNoteText(c) {
  if (!c.done) return '';
  const amt = String(c.amount || '').trim();
  const dev = amt ? `（${amt}${c.unit || '分'}${c.dir || '遅れ'}）` : '';
  return c.done === '有' ? `※時刻合わせ実施。${dev || `（○${c.unit || '分'}${c.dir || '遅れ'}）`}` : `※時刻合わせ無し。${dev}`;
}
function applyClock(data) {
  const text = clockNoteText(data.clock);
  if (!text) return;
  const lines = String(data.note || '') ? String(data.note).split('\n') : [];
  const i = lines.findIndex(l => CLOCK_NOTE_RE.test(l));
  if (i >= 0) lines[i] = lines[i].replace(CLOCK_NOTE_RE, text);
  else lines.push(text);
  data.note = lines.join('\n');
}
function clockSection(d, data, editable) {
  const dis = editable ? '' : 'disabled';
  const c = data.clock;
  const prev = (d.info.prev.note || []).map(l => (l.match(CLOCK_NOTE_RE) || [])[0]).find(Boolean) || '（記事に記載なし）';
  return `<h3>時刻合わせ${recSuffix(d)} <small>選ぶと記事に反映されます</small></h3>
    <div class="grid2">
      <label>時刻合わせ<select data-k="clock.done" ${dis}>${opts(['', '有', '無'], c.done).replace('<option ', '<option value="" ').replace('></option>', '>（選択）</option>')}</select></label>
      <label>ずれ<select data-k="clock.dir" ${dis}>${opts(['遅れ', '進み'], c.dir)}</select></label>
      <label>ずれの量<input class="num" inputmode="decimal" data-k="clock.amount" value="${h(c.amount)}" placeholder="例 5" ${dis}></label>
      <label>単位<select data-k="clock.unit" ${dis}>${opts(['分', '秒'], c.unit)}</select></label>
    </div>
    <div class="ptext">(今回)<span id="clock-now">${h(clockNoteText(c) || '（有・無を選んでください）')}</span></div>
    <div class="ptext">(前回)${h(prev)}</div>
    ${opt(d, 'clockJst') ? '<button type="button" class="btn small" data-act="jst">日本標準時間</button>' : ''}`;
}

// ---- 修正手順（記録計・タッチパネル）・確認手順（調節計）。web/manual/ に置いた画像を表示する ----
//   タッチパネルは機種のシリーズごとに手順が違うため、シートの各台の型番からシリーズを判定し、シリーズごとに画像を出す
//   画像の名前：<シリーズ>-<手順>.png（2枚目以降は -2.png、-3.png …）。例：gp4000-clock.png
const MANUAL_PROCS = { brightness: '輝度調整', clock: '時刻合わせ', bias: 'PVフィルタ・バイアス' };
// 時刻合わせの見出しの「（記録計）」は、名称に記録計とある機器だけに付ける（記録計以外の種類に時刻合わせを出す設定もできるため）
const recSuffix = d => /記録計/.test((d.info && d.info.name) || d.tag || '') ? '（記録計）' : '';
// その機器で見られる手順（設定の機器種類の manual。輝度調整はタッチパネル、PVフィルタ・バイアスは計器だけ。調節弁には無い）
function manualProcs(d) {
  return (typeOf(d).manual || []).filter(p => MANUAL_PROCS[p] && d.kind !== KIND.VALVE &&
    (p !== 'brightness' || d.kind === KIND.TOUCH) && (p !== 'bias' || d.kind === KIND.KEIKI));
}
// 手順画像のシリーズ（設定の series。型番の先頭で判定）
const seriesOf = model => {
  const m = nk(model);
  return (appConfig.series || DEFAULT_CONFIG.series).find(s => (s.prefixes || []).some(p => nk(p) && patRe(p).test(m)));
};
const loadImg = src => new Promise(ok => { const img = new Image(); img.onload = () => ok(img); img.onerror = () => ok(null); img.src = src; });
async function loadManualImages(base) {
  const list = [];
  // 編集画面で追加した手順画像（サーバー）があれば、そちらを使う。読めなければ web/manual の画像
  const pids = manualImgs[base] || [];
  for (const pid of pids) {
    try {
      const img = await loadImg(await photoUrl(pid));
      if (img) { img.className = 'man-img'; list.push(img); }
    } catch (e) { list.length = 0; break; }
  }
  if (list.length) return list;
  for (let n = 1; n <= 20; n++) {
    const name = n === 1 ? base : `${base}-${n}`;
    const img = (await loadImg(`manual/${name}.png`)) || (await loadImg(`manual/${name}.jpg`));
    if (!img) break;
    img.className = 'man-img';
    list.push(img);
  }
  return list;
}

async function showManual(d) {
  // 手順が「時刻合わせ」だけ（記録計）ならすぐ出す。それ以外（タッチパネル、PVフィルタ・バイアスのある計器）は選んでもらう
  const procs = manualProcs(d);
  if (!procs.length) return;
  let proc = procs[0];
  //   （PVフィルタ・バイアスは、1つだけでも選んでから出す＝調節計の確認手順の決まり）
  if (!(procs.length === 1 && proc !== 'bias')) {
    const mixed = d.kind !== KIND.TOUCH && procs.includes('clock') && procs.length > 1;
    const title = d.kind === KIND.TOUCH ? '修正手順を選んでください。' : mixed ? '手順を選んでください。' : procs.includes('clock') ? '修正手順を選んでください。' : '確認手順を選んでください。';
    proc = await choose(title, [
      ...procs.map(p => ({ key: p, label: p === 'clock' && mixed ? '時刻合わせ（修正手順）' : MANUAL_PROCS[p] })),
      { key: 'cancel', label: 'キャンセル' },
    ]);
    if (!MANUAL_PROCS[proc]) return;
  }
  // 表示する組：機種のシリーズごと（どの台が該当するかも書く）。型番は現場で変更していれば変更後で判定する
  const dr = drafts[d.id];
  const data = dr ? dr.data : normalize(d, d.data);
  const units = d.kind === KIND.TOUCH
    ? (d.info.panels || []).map((p, b) => ({ name: p.name, key: `p${b}.model`, model: p.model }))
    : [{ name: d.tag, key: 'model', model: d.info.model }];
  const groups = [];
  const other = [];
  units.forEach(u => {
    const c = (d.info.checks || []).find(x => x.key === u.key);
    const model = c && isChanged(data, c) ? fieldOf(data, c).value : u.model;
    const s = seriesOf(model);
    if (!s) { other.push(`${u.name}（${model || '型番なし'}）`); return; }
    let g = groups.find(x => x.key === s.key);
    if (!g) groups.push(g = { key: s.key, title: s.name, bases: [`${s.key}-${proc}`], panels: [] });
    g.panels.push(`${u.name}（${model}）`);
  });
  if (other.length) groups.push({ title: '手順の無い機種', panels: other });
  const el = document.createElement('div');
  el.className = 'modal manual';
  el.innerHTML = `<div class="box"><div class="msg" style="font-weight:700">${proc === 'bias' ? '確認手順：PVフィルタ・バイアス（' + (/指示計/.test(d.info.name || '') && !/調節計/.test(d.info.name || '') ? '指示計' : '調節計') + '）' : '修正手順：' + h(MANUAL_PROCS[proc]) + (d.kind === KIND.TOUCH ? '' : recSuffix(d))}</div>
    ${groups.map((g, i) => `<div class="man-group">${g.title ? `<div class="man-title">${h(g.title)}</div>` : ''}
      ${g.panels.length ? `<div class="muted">${g.panels.map(h).join('<br>')}</div>` : ''}
      <div data-man-imgs="${i}">${g.bases ? '<p class="muted">読み込み中…</p>' : ''}</div></div>`).join('')}
    <button class="btn" data-man="close">閉じる</button></div>`;
  el.addEventListener('click', e => { if (e.target === el || e.target.closest('[data-man=close]')) el.remove(); });
  document.body.appendChild(el);
  for (let i = 0; i < groups.length; i++) {
    if (!groups[i].bases) continue;
    let imgs = [];
    for (const base of groups[i].bases) { imgs = await loadManualImages(base); if (imgs.length) break; }
    if (!el.isConnected) return;
    const box = el.querySelector(`[data-man-imgs="${i}"]`);
    box.innerHTML = imgs.length ? '' : `<p class="muted">この手順の画像はまだ登録されていません（web/manual/${h(groups[i].bases[0])}.png）。</p>`;
    imgs.forEach(img => box.appendChild(img));
  }
}
// ---- 日本標準時（NICT）。NICT の時計ページと同じ時刻サーバーから時刻を取り、iPhone の時計とのずれを補正して表示する ----
const NICT_HOSTS = ['3fe5a5f690efc790d4764f1c528a4ebb89fa4168', '67495dde3b39c2991829589f0101ab7a035eecf5', '08a08e3a6edef4ba7a0c055a42d8e1ba2597f2b5'];
async function nictOffset() {
  for (const host of NICT_HOSTS) {
    try {
      const ctl = new AbortController();
      const timer = setTimeout(() => ctl.abort(), 3000);
      const it = Date.now();
      const res = await fetch(`https://${host}.nict.go.jp/cgi-bin/json?${it / 1000}`, { signal: ctl.signal, cache: 'no-store' });
      const j = await res.json();
      const rt = Date.now();
      clearTimeout(timer);
      if (j.st) return { offset: j.st * 1000 - (it + rt) / 2, rtt: rt - it };  // 片道の時間を差し引いた、JST − iPhone の時計
    } catch (e) { /* 次のサーバーを試す */ }
  }
  return null;
}

function showJst() {
  const el = document.createElement('div');
  el.className = 'modal';
  el.innerHTML = `<div class="box"><div class="msg" style="font-weight:700">日本標準時（JST）　NICT</div>
    <div class="jst-time" id="jst-time">--:--:--</div><div class="jst-date" id="jst-date">取得中…</div>
    <div class="jst-note" id="jst-note"></div>
    <button class="btn" data-jst="close">閉じる</button></div>`;
  document.body.appendChild(el);
  let offset = null;
  let timer = null;
  const p2 = n => String(n).padStart(2, '0');
  const tick = () => {
    const t = new Date(Date.now() + offset + 9 * 3600 * 1000);  // UTC の値として JST の日時を読む
    el.querySelector('#jst-time').textContent = `${p2(t.getUTCHours())}:${p2(t.getUTCMinutes())}:${p2(t.getUTCSeconds())}`;
    el.querySelector('#jst-date').textContent = `${t.getUTCFullYear()}年${t.getUTCMonth() + 1}月${t.getUTCDate()}日（${'日月火水木金土'[t.getUTCDay()]}）`;
  };
  const close = () => { clearInterval(timer); el.remove(); };
  el.addEventListener('click', e => { if (e.target === el || e.target.closest('[data-jst=close]')) close(); });
  nictOffset().then(r => {
    if (!el.isConnected) return;
    if (!r) { el.querySelector('#jst-date').textContent = '取得できませんでした（圏外の可能性があります）'; return; }
    offset = r.offset;
    tick();
    timer = setInterval(tick, 100);
    const s = Math.abs(offset / 1000);
    el.querySelector('#jst-note').textContent = s < 0.5 ? 'このiPhoneの時計はほぼ正確です'
      : `このiPhoneの時計は ${s.toFixed(1)} 秒${offset > 0 ? '遅れて' : '進んで'}います（表示は補正済み）`;
  });
}

// ---- データ初期化（パスワードはサーバー側で確認する）----
async function resetData() {
  const pass = await askText('データ初期化のパスワードを入力してください。', '', 'password');
  if (pass == null || !pass.trim()) return;
  try {
    await withBusy('確認しています…', () => api('resetPlant', { pass: pass.trim(), check: true }));
  } catch (e) {
    return alert(e.code === 'offline' ? 'データ初期化には電波が必要です。' : e.message);
  }
  const plants = [...new Set(devices.map(plantOf))].sort(byName);
  const p = await choose('初期化する工場（年度）を選んでください。',
    plants.map(x => ({ key: x, label: plantLabel(x), cls: 'warn' })).concat([{ key: '__cancel', label: 'キャンセル' }]));
  if (!p || p === '__cancel') return;
  if (!confirm(`「${plantLabel(p)}」で、このアプリに入力された情報（測定値・作業中・一時保存・完了の記録）をすべて消して、未着手に戻します。\nExcelのファイルは変わりません。元に戻せません。よろしいですか？`)) return;
  try {
    const j = await withBusy('初期化しています…', () => api('resetPlant', { plant: p, pass: pass.trim() }));
    alert(`初期化しました（${j.reset} 件を未着手に戻しました）。`);
  } catch (e) {
    alert(e.message);
  }
  await refresh(true);
}

// 画面下からせり上がる入力ダイアログ。OK なら入力した文字、キャンセルなら null を返す
function askText(message, value, type) {
  return new Promise(resolve => {
    const el = document.createElement('div');
    el.className = 'modal';
    el.innerHTML = `<div class="box"><div class="msg">${h(message)}</div>
      <input id="ask-in" type="${type === 'password' ? 'password' : 'text'}" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" style="width:100%" value="${h(value)}">
      <button class="btn primary" data-ask="ok">OK</button><button class="btn" data-ask="cancel">キャンセル</button></div>`;
    const done = v => { el.remove(); resolve(v); };
    el.addEventListener('click', e => {
      const b = e.target.closest('[data-ask]');
      if (!b && e.target !== el) return;
      done(b && b.dataset.ask === 'ok' ? el.querySelector('#ask-in').value : null);
    });
    document.body.appendChild(el);
    const inp = el.querySelector('#ask-in');
    inp.focus();
    inp.select();
  });
}

// 時計の遅れ／進みから報告書の文言を作る（前年度の書き方に合わせる）
function clockText(p) {
  if (!p.clockDir || p.clockDir === CLOCK_OK || p.clockDir === '良好') return CLOCK_OK;
  const m = String(p.clockMin || '').trim() || '○';
  return `ﾀｯﾁﾊﾟﾈﾙの内部時計時刻が${p.clockDir === '遅れ' ? '遅れて' : '進んで'}いたため実施（${m}分${p.clockDir}）`;
}

function setPath(obj, path, val) {
  const ks = path.split('.');
  let o = obj;
  for (let i = 0; i < ks.length - 1; i++) o = o[ks[i]];
  o[ks[ks.length - 1]] = val;
}

function touchDraft(id) {
  const dr = drafts[id];
  dr.rev = (dr.rev || 0) + 1;
  dr.pending = true;
  saveDrafts();
  renderNet();
  scheduleSync(4000);
}

function localStatus(d) {
  const dr = drafts[d.id];
  // サーバーに拒否された入力（自動では送られない）：完了には数えず、赤で知らせる
  if (dr && dr.blocked && dr.pending) return { cls: 'ng', text: '送信できず' };
  if (dr && dr.finish && dr.pending) return { cls: 'pend', text: '完了(未送信)' };
  if (d.status === ST.WORK) return { cls: 'work', text: d.worker === cfg.name ? '作業中(自分)' : '作業中 ' + d.worker };
  if (d.status === ST.DONE) return { cls: 'done', text: '完了' };
  // 中断（保存）されたもの：フィルター・パッキン類を「交換済み」にしてあれば「動作確認待ち」、それ以外は「一時保存(名前)」
  if (d.data && d.worker) return waitingCheck(d) ? { cls: 'wait', text: '動作確認待ち' } : { cls: 'temp', text: `一時保存(${d.worker})` };
  return { cls: 'todo', text: '未着手' };
}

// 「動作確認待ち」：フィルター類の部品を「交換済み」にしてから中断した機器（交換後の動作確認が残っている）。それ以外は「一時保存(名前)」
function waitingCheck(d) {
  const data = d.data;
  if (!data || !data.replaced) return false;
  const parts = data.partsEdited && Array.isArray(data.parts) ? data.parts : ((d.info.prev || {}).parts || []);
  return Object.keys(data.replaced).some(n => data.replaced[n] && parts[n] && isFilterPart(parts[n].name));
}


// ---- 画面 ----
function render() {
  if (!ready()) return renderSetup();
  if (String(view.screen).startsWith('arch')) return renderArch();
  if (view.screen === 'detail') return renderDetail();
  // 選んでいた工場・報告書が一覧から無くなった（名前変更など）ときは一つ上の選択に戻す
  //   （一覧を読み込んだ後で機器が1台も無い＝すべての工場を点検完了にした等のときも、工場の画面へ）
  if (view.screen !== 'plants' && (devices.length || fetchedAt) && !devices.some(d => plantOf(d) === view.plant)) view.screen = 'plants';
  if (view.screen === 'list' && view.loc !== ALL && !devices.some(d => plantOf(d) === view.plant && fileOf(d) === view.loc)) view.screen = 'locs';
  if (view.screen === 'plants') return renderPlants();
  // 共有メモを入力中（自動更新など）は画面を作り直さない（入力中の文字やカーソルが消えるため）
  if (view.screen === 'locs' && document.activeElement && document.activeElement.id === 'memo') return;
  if (view.screen === 'locs') return renderLocs();
  // 検索欄に入力中（自動更新など）は欄を作り直さず結果だけ更新する
  if (document.activeElement && document.activeElement.id === 'q' && $('#results')) {
    $('#results').innerHTML = listResults(listScope());
    return;
  }
  renderList();
}

function renderTop(title, back) {

}

// ---- 工場・報告書（Excelファイル）のメニュー ----
const ALL = '__all__';
const plantOf = d => d.plant || '（工場名なし）';
const fileOf = d => d.file || '（報告書名なし）';
const fileLabel = f => f.replace(/_/g, ' ');
// 工場のメニュー名は「工場名＋今年の年度」
function plantLabel(p) {
  const years = devices.filter(d => plantOf(d) === p).map(d => +(d.info && d.info.year) || 0);
  const y = Math.max(0, ...years);
  return y ? `${p} ${y}年度` : p;
}
const isDone = d => ['done', 'pend'].includes(localStatus(d).cls);
const byName = (a, b) => a.localeCompare(b, 'ja', { numeric: true });

function progress(list, doneOf = isDone) {
  const done = list.filter(doneOf).length;
  const pct = list.length ? Math.round(done / list.length * 100) : 0;
  return `<div class="prog ${list.length && done === list.length ? 'full' : ''}"><div class="bar"><i style="width:${pct}%"></i></div><span class="cnt">完了 ${done}/${list.length}</span></div>`;
}

function menuItem(act, key, name, list) {
  const work = list.filter(d => d.status === ST.WORK).length;
  return `<button class="menu" data-act="${act}" data-key="${h(key)}">
    <div class="main"><div class="name">${h(name)}</div>${progress(list)}${work ? `<div class="sub">作業中 ${work}台</div>` : ''}</div>
    <span class="chev">›</span></button>`;
}

// 自分が作業中・未送信の機器は、どの画面からでもすぐ戻れるよう上に出す
function mineSection(list) {

function itemButton(d) {

  return `<button class="item ${mine ? 'mine' : ''}" data-act="open" data-id="${h(d.id)}">
    ${(notes[d.id] || {}).flag ? '<i class="flagtab"></i>' : ''}<div class="main"><div class="tag">${h(d.tag)}</div><div class="sub">${h(d.title)}${d.kind !== KIND.TOUCH && d.info && d.info.loc ? '（' + h(d.info.loc) + '）' : ''}</div></div>
    <span class="right"><span class="badge st-${s.cls}">${h(s.text)}</span>${sealSwitch(d)}</span></button>`;

// タッチパネルの時計が「PLC から受け取った時刻」か「タッチパネル本体の時計」か（台ごと。全員で共有。初期化しても消えない）
//   今後、時刻の設定方法を手順に書き分けるための記録。報告書（Excel）には書かない。もう一度押すと取り消し
const CLOCK_SRCS = [['PLC', 'PLC時刻'], ['タッチパネル', 'タッチパネル時刻']];
function clockSrcRow(d, b) {
  const n = notes[d.id] || {};
  const cur = (n.clockSrc || [])[b] || '';
  const pend = n.clockSrcPending && n.clockSrcPending[b];
  const who = cur && n.clockSrcBy && !pend ? `<small class="muted">（${h(n.clockSrcBy)}${n.clockSrcAt ? ' ' + h(String(n.clockSrcAt).slice(5, 10).replace('-', '/')) : ''}）</small>` : '';
  return `<div class="clocksrc"><span>表示している時刻 <small class="muted">どちらか1つ（記録のみ・報告書には書きません）</small>${who}</span>
    <div class="names pick">${CLOCK_SRCS.map(([v, label]) => `<button type="button" class="${cur === v ? 'on' : ''}${pend ? ' wait' : ''}" data-act="clocksrc" data-id="${h(d.id)}" data-b="${b}" data-src="${h(v)}" ${PREVIEW || view.screen === 'archDetail' ? 'disabled' : ''}>${h(label)}</button>`).join('')}</div></div>`;
}

// すぐ切り替えて見せ、裏でサーバーへ送る（だめなら元に戻す）。選んでいるほうをもう一度押すと取り消し
async function setClockSrc(id, b, v) {
  const d = getDev(id);
  if (!d || PREVIEW) return;
  const before = Object.assign({}, notes[id]);
  if (before.clockSrcPending && before.clockSrcPending[b]) return;
  const list = (before.clockSrc || []).slice();
  while (list.length <= b) list.push('');
  const src = list[b] === v ? '' : v;
  list[b] = src;
  notes[id] = Object.assign({}, before, { clockSrc: list, clockSrcPending: Object.assign({}, before.clockSrcPending, { [b]: true }) });
  if (view.screen === 'detail' && view.id === id) renderDetail();
  try {
    const j = await netTask(() => api('setClockSrc', { id, tag: d.tag, plant: d.plant, panel: b, src }));
    const pendLeft = Object.assign({}, (notes[id] || {}).clockSrcPending); delete pendLeft[b];
    // 返ってきた内容に、ほかの台でまだ送信中の選択があれば、その台だけ手元の選択を残す
    const got = (j.note.clockSrc || []).slice();
    Object.keys(pendLeft).forEach(k => { while (got.length <= k) got.push(''); got[k] = ((notes[id] || {}).clockSrc || [])[k] || ''; });
    // 書き換えるのは時刻の元だけ（応答が遅れて届いても、その間に変わったメモ・シールなどを古い内容で戻さない）
    const nowN = Object.assign({}, notes[id]);
    delete nowN.clockSrcPending;
    notes[id] = Object.assign(nowN, { clockSrc: got, clockSrcAt: j.note.clockSrcAt, clockSrcBy: j.note.clockSrcBy }, Object.keys(pendLeft).length ? { clockSrcPending: pendLeft } : {});
    store.set('notes', notes);
  } catch (e) {
    const cur = notes[id] || {};
    const pendLeft = Object.assign({}, cur.clockSrcPending); delete pendLeft[b];
    const back = (cur.clockSrc || []).slice(); back[b] = (before.clockSrc || [])[b] || '';
    notes[id] = Object.assign({}, cur, { clockSrc: back, clockSrcPending: pendLeft });
    alert(e.code === 'offline' ? '時刻の元の記録には電波が必要です。' : e.message);
  }
  if (view.screen === 'detail' && view.id === id) renderDetail(); else if (view.screen !== 'detail') render();
}

// 点検シールを貼ったかの確認用スイッチ（全員で共有。データ初期化で外れる）。押しても機器は開かない
function sealSwitch(d) {
  const on = !!(notes[d.id] || {}).seal;
  return `<span class="seal ${on ? 'on' : ''}" role="switch" aria-checked="${on}" data-act="seal" data-id="${h(d.id)}"><span class="sl">点検シール</span><span class="track"><span class="knob"></span></span></span>`;
}

// スイッチはすぐ切り替えて見せ、裏でサーバーへ送る（だめなら元に戻す）
async function toggleSeal(id) {
  const d = getDev(id);
  if (!d) return;
  const before = Object.assign({}, notes[id]);
  const seal = !before.seal;
  notes[id] = Object.assign({}, before, { seal, sealPending: true });
  render();
  try {
    const j = await netTask(() => api('setSeal', { id, tag: d.tag, plant: d.plant, seal }));
    // 書き換えるのはシールだけ（応答が遅れて届いても、その間に変わったタッチパネル時刻の元などを古い内容で戻さない）
    const now = Object.assign({}, notes[id]);
    delete now.sealPending;
    notes[id] = Object.assign(now, { seal: j.note.seal, sealAt: j.note.sealAt, sealBy: j.note.sealBy });
    store.set('notes', notes);
  } catch (e) {
    notes[id] = Object.assign({}, before, { sealPending: false });
    alert(e.code === 'offline' ? '点検シールの記録には電波が必要です。' : e.message);
  }
  if (view.screen !== 'detail') render();
}

    <div class="sect">過去点検データ</div>

// ---- 点検完了（工場の点検を「過去点検データ」へ移す。パスワードはデータ初期化と同じ）----
async function closePlant() {
  const plant = view.plant;
  const inPlant = devices.filter(d => plantOf(d) === plant);
  const unsent = inPlant.filter(d => drafts[d.id] && drafts[d.id].pending);
  if (unsent.length) return alert(`この端末に送信していない入力があります（${unsent.map(d => d.tag).slice(0, 5).join('、')}）。送信してから、もう一度押してください。`);
  const pass = await askText('点検完了のパスワード（データ初期化と同じ）を入力してください。', '', 'password');
  if (pass == null || !pass.trim()) return;
  try { await withBusy('確認しています…', () => api('closePlant', { pass: pass.trim(), check: true })); }
  catch (e) { return alert(e.code === 'offline' ? '点検完了には電波が必要です。' : e.message); }
  if (!confirm(`「${plantLabel(plant)}」の点検を完了にします。\n・機器のデータは「過去点検データ」へ移り、見るだけになります（入力・Excel反映はできなくなります）\n・この工場は工場の一覧から消えます（来年度の機器一覧の登録で、また出てきます）\n・Excelのファイルは変わりません\nよろしいですか？`)) return;
  const send = force => withBusy('点検完了にしています…', () => api('closePlant', { plant, pass: pass.trim(), force }));
  let j;
  try { j = await send(false); }
  catch (e) {
    if (e.code !== 'closeconfirm') return alert(e.message);
    if (!confirm(`${e.message}。\nこのまま点検完了にしますか？（その機器は、入力が無い・途中のまま保管されます）`)) return;
    try { j = await send(true); } catch (e2) { return alert(e2.message); }
  }
  // この工場の機器の、端末に残った（送信済みの）入力の控えを消す
  inPlant.forEach(d => { if (drafts[d.id] && !drafts[d.id].pending) delete drafts[d.id]; });
  saveDrafts();
  alert(`点検完了にしました（${j.closed} 台）。トップの「過去点検データ」から見られます。`);
  view.screen = 'plants'; view.plant = null; view.loc = null; saveNav();
  await withBusy('読み込み中…', () => refresh(true));
  render();
}

// ---- 過去点検データ（見るだけ）。画面：archs（一覧）→ archLocs（報告書）→ archList（機器）→ archDetail（機器の内容）----

// ---- 写真（機器ごと。全員で共有。初期化・点検完了でも消えない。画像は Googleドライブ）----
const thumbCache = {};   // 機器ID → [{ pid, at, by, caption, thumb }]（一覧用の小さい画像）
const photoCache = new Map();   // 画像ID → data URL（元の大きさ。新しい 12 枚だけ覚える）
function photoSection(d) {
  if (PREVIEW) return '';
  const n = photoCount[d.id] || 0;
  return `<section class="card" id="photo-card"><h3 style="margin-top:0">写真 <small class="muted">全員で共有・データ初期化や点検完了でも消えません</small></h3>
    <div class="photos" id="photos" data-for="${h(d.id)}">${photoGrid(d.id) || (n ? '<p class="muted">読み込み中…</p>' : '<p class="muted">まだありません</p>')}</div>
    <label class="btn small photo-add">写真を撮る・追加する<input type="file" accept="image/*" multiple data-photo-add="${h(d.id)}" style="display:none"></label></section>`;
}
function photoGrid(id) {
  const list = thumbCache[id];
  if (!list || !list.length) return '';
  return list.map(p => `<button type="button" class="pthumb" data-act="photo" data-pid="${h(p.pid)}" data-id="${h(id)}">
    ${p.thumb ? `<img src="data:image/jpeg;base64,${p.thumb}" alt="">` : '<span>写真</span>'}<small>${h(hm(p.at).slice(0, 5))} ${h(p.by || '')}</small></button>`).join('');
}
function drawPhotos(id) {
  const el = $('#photos');
  if (!el || el.dataset.for !== id) return;
  el.innerHTML = photoGrid(id) || '<p class="muted">まだありません</p>';
}
const photoFetchedAt = {};  // 機器ID → 一覧用の画像を取りに行った時刻（画面を作り直すたびに取りに行かないように）
async function loadPhotos(d) {
  if (PREVIEW || !(photoCount[d.id] || thumbCache[d.id])) return;
  // 1分以内に取りに行った機器は、手元の一覧を使う（枚数が変わっていれば取り直す）
  if (thumbCache[d.id] && thumbCache[d.id].length === (photoCount[d.id] || 0) && Date.now() - (photoFetchedAt[d.id] || 0) < 60000) return;
  photoFetchedAt[d.id] = Date.now();
  try {
    const j = await netTask(() => api('photos', { target: d.id }));
    thumbCache[d.id] = j.photos;
    photoCount[d.id] = j.photos.length;
    store.set('photoCount', photoCount);
  } catch (e) {
    const el = $('#photos');
    if (el && el.dataset.for === d.id && !thumbCache[d.id]) el.innerHTML = `<p class="muted">${e.code === 'offline' ? '写真を見るには電波が必要です' : h(e.message)}</p>`;
    return;
  }
  drawPhotos(d.id);
}
// 画像を縮める（長い辺を max ピクセルに。JPEG）。base64 を返す
async function shrinkImage(file, max, q) {
  const url = URL.createObjectURL(file);
  try {
    const img = await loadImg(url);
    if (!img || !img.naturalWidth) throw new Error('画像を読み込めませんでした（形式を確認してください）');
    const s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(img.naturalWidth * s));
    c.height = Math.max(1, Math.round(img.naturalHeight * s));
    const g = c.getContext('2d');
    g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height);  // PNG の透明部分は白に
    g.drawImage(img, 0, 0, c.width, c.height);
    return c.toDataURL('image/jpeg', q).split(',')[1];
  } finally { URL.revokeObjectURL(url); }
}
async function addPhotos(id, files, dev) {
  const d = dev || curDev() || getDev(id);
  if (!d || !files.length) return;
  let done = 0;
  for (let i = 0; i < files.length; i++) {
    try {
      const j = await withBusy(`写真を送っています（${i + 1}/${files.length}）…`, async () => {
        const b64 = await shrinkImage(files[i], 1600, 0.82);
        const thumb = await shrinkImage(files[i], 240, 0.7);
        return api('addPhoto', { target: d.id, tag: d.tag, plant: d.plant, b64, thumb, mime: 'image/jpeg' });
      });
      (thumbCache[d.id] = thumbCache[d.id] || []).push(j.photo);
      photoCount[d.id] = (photoCount[d.id] || 0) + 1;
      store.set('photoCount', photoCount);
      done++;
      drawPhotos(d.id);
    } catch (e) {
      alert(e.code === 'offline' ? '写真を送るには電波が必要です。電波のある所でもう一度追加してください。' : '写真を送れませんでした：' + e.message);
      break;
    }
  }
  return done;
}
async function photoUrl(pid) {
  if (photoCache.has(pid)) return photoCache.get(pid);
  const j = await api('getPhoto', { pid });
  const url = `data:${j.mime || 'image/jpeg'};base64,${j.b64}`;
  photoCache.set(pid, url);
  while (photoCache.size > 12) photoCache.delete(photoCache.keys().next().value);
  return url;
}
function showPhoto(id, pid) {
  const p = (thumbCache[id] || []).find(x => x.pid === pid) || {};
  const el = document.createElement('div');
  el.className = 'modal photo-view';
  el.innerHTML = `<div class="box"><div class="pv-img">${p.thumb ? `<img src="data:image/jpeg;base64,${p.thumb}" alt="">` : ''}<p class="muted" data-pv="msg">読み込み中…</p></div>
    <div class="muted">${h(hm(p.at))}${p.by ? '　' + h(p.by) : ''}</div>
    <button class="btn" data-pv="close">閉じる</button><button class="btn warn small" data-pv="del">この写真を削除</button></div>`;
  el.addEventListener('click', async e => {
    if (e.target === el || e.target.closest('[data-pv=close]')) return el.remove();
    if (e.target.closest('[data-pv=del]')) {
      if (!confirm('この写真を削除します（全員の画面から消えます）。よろしいですか？')) return;
      try {
        await withBusy('削除しています…', () => api('deletePhoto', { pid }));
        thumbCache[id] = (thumbCache[id] || []).filter(x => x.pid !== pid);
        photoCount[id] = Math.max(0, (photoCount[id] || 1) - 1);
        store.set('photoCount', photoCount);
        el.remove();
        drawPhotos(id);
      } catch (err) { alert(err.code === 'offline' ? '削除には電波が必要です。' : err.message); }
    }
  });
  document.body.appendChild(el);
  photoUrl(pid).then(url => {
    if (!el.isConnected) return;
    el.querySelector('.pv-img').innerHTML = `<img src="${url}" alt="">`;
  }).catch(e => { const m = el.querySelector('[data-pv=msg]'); if (m) m.textContent = e.code === 'offline' ? '元の大きさの写真を見るには電波が必要です' : e.message; });
}

async function saveMemo(force) {
  const plant = view.plant;
  const el = $('#memo');

  try {

    store.set('memos', memos);

    if (e.code === 'memoconflict') {
      const c = await choose(`${e.message}。どうしますか？`, [
        { key: 'over', label: '自分の内容で上書きする', cls: 'warn' },
        { key: 'load', label: '最新の内容を表示する（自分の入力は消えます）' },

      return;
    }
    alert(e.code === 'offline' ? 'メモの保存には電波が必要です。入力した内容はこの端末に残っています。' : e.message);

}

// 検索欄は作り直さず、結果だけを書き換える（日本語入力の変換中に欄を作り直すと文字が二重に入るため）
function listResults(scope) {
  const q = view.q.trim().toLowerCase();
  const match = d => {
    const st = d.status;
    const dr = drafts[d.id];
    if (view.filter === 'mine' && !(st === ST.WORK && d.worker === cfg.name) && !(dr && dr.pending)) return false;
    if (view.filter === 'todo' && st !== ST.TODO) return false;
    if (view.filter === 'work' && st !== ST.WORK) return false;
    if (view.filter === 'done' && st !== ST.DONE) return false;
    return !q || (d.tag + ' ' + d.title + ' ' + (d.info.name || '')).toLowerCase().includes(q);
  };
  const groups = {};
  scope.filter(match).forEach(d => (groups[d.file] = groups[d.file] || []).push(d));
  return Object.entries(groups).map(([file, list]) => `
      ${view.loc === ALL ? `<div class="group">${h(fileLabel(file))}</div>` : '<div style="height:8px"></div>'}
      ${list.map(itemButton).join('')}`).join('') || '<p class="muted">該当する機器がありません</p>';
}

// 精度：報告書の書き方どおり（例：±1 ﾃﾞｼﾞｯﾄ　±0.5 ％ F.S）。登録データが古い場合は %F.S だけ
function accuracyText(i) {
  const d = (i.details || []).find(x => x.label === '精度');
  if (d) return h(d.value);
  return i.accuracy != null ? '±' + h(i.accuracy) + ' %F.S' : '';
