<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="検査入力">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1f4e79">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>検査入力</title>
<style>
:root {
  --bg: #f3f5f8; --card: #fff; --ink: #1d2733; --sub: #5d6b7a; --line: #d5dbe3;
  --pri: #1f4e79; --pri-ink: #fff; --todo: #7d8995; --work: #c76a12; --done: #23804d; --ng: #c62828; --mine: #fff4e5;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 -apple-system, "Hiragino Sans", "Hiragino Kaku Gothic ProN", sans-serif; -webkit-text-size-adjust: 100%; }
button, input, select, textarea { font: inherit; color: inherit; }
header.top { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 8px; padding: calc(env(safe-area-inset-top) + 8px) 16px 8px; background: var(--pri); color: var(--pri-ink); }
header.top .ttl { flex: 1; min-width: 0; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
header.top button.back { background: none; border: 0; color: inherit; font-size: 17px; padding: 4px 8px 4px 0; white-space: nowrap; }
.net { font-size: 12px; padding: 3px 10px; border-radius: 99px; background: rgba(255,255,255,.2); border: 0; color: #fff; white-space: nowrap; }
.net.off { background: #b71c1c; }
.net.pend { background: #e08a00; }
main { padding: 12px 16px calc(env(safe-area-inset-bottom) + 96px); max-width: 760px; margin: 0 auto; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-bottom: 12px; }
h2 { font-size: 18px; margin: 0 0 10px; }
h3 { font-size: 16px; margin: 18px 0 6px; }
h3 small { font-weight: 400; color: var(--sub); font-size: 12px; }
label { display: block; min-width: 0; font-size: 13px; color: var(--sub); margin-bottom: 10px; }
label > input, label > select, label > textarea { display: block; width: 100%; min-width: 0; margin-top: 4px; }
input, select, textarea { font-size: 16px; padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px; background: #fff; min-height: 42px; min-width: 0; }
/* iOS の日付欄は既定の見た目だと幅が縮まず隣の欄に重なるため、見た目を解除して幅を効かせる */
input[type=date] { -webkit-appearance: none; appearance: none; width: 100%; }
input[type=date]::-webkit-date-and-time-value { text-align: left; }
input::placeholder { color: #b9c1cb; }
input:disabled, select:disabled, textarea:disabled { background: #f0f2f5; color: var(--ink); opacity: 1; -webkit-text-fill-color: var(--ink); }
textarea { min-height: 120px; resize: vertical; }
.btn { display: block; width: 100%; padding: 13px; border-radius: 10px; border: 1px solid var(--line); background: #fff; font-weight: 600; margin-top: 10px; }
.btn.primary { background: var(--pri); color: #fff; border-color: var(--pri); }
.btn.ok { background: var(--done); color: #fff; border-color: var(--done); }
.btn.warn { color: var(--ng); }
.btn.small { padding: 9px; font-size: 14px; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 0 10px; }
.muted { color: var(--sub); font-size: 13px; }
.notice { padding: 10px 12px; border-radius: 10px; margin-bottom: 12px; font-size: 14px; background: #fff; border: 1px solid var(--line); }
.notice.work { background: #fff1e0; border-color: #f0c58f; }
.notice.err { background: #fdecea; border-color: #f3b4ae; }
.notice.done { background: #e6f4ec; border-color: #a9d8bc; }
.filters { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 8px; }
.filters button { flex: none; border: 1px solid var(--line); background: #fff; border-radius: 99px; padding: 6px 12px; font-size: 14px; }
.filters button.on { background: var(--pri); color: #fff; border-color: var(--pri); }
.search { width: 100%; margin-bottom: 10px; }
.group { font-size: 13px; color: var(--sub); margin: 14px 0 6px; font-weight: 700; }
.item { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 6px; }
.item.mine { background: var(--mine); border-color: #f0c58f; }
.item .main { flex: 1; min-width: 0; }
.item .tag { font-weight: 700; }
.item .sub { font-size: 13px; color: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.badge { flex: none; font-size: 12px; font-weight: 700; color: #fff; padding: 3px 9px; border-radius: 99px; max-width: 45%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.st-todo { background: var(--todo); } .st-work { background: var(--work); } .st-done { background: var(--done); } .st-pend { background: #e08a00; }
dl.info { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 12px; margin: 8px 0 0; font-size: 14px; }
dl.info dt { color: var(--sub); }
dl.info dd { margin: 0; word-break: break-all; }
table.pt { width: 100%; table-layout: fixed; border-collapse: collapse; font-size: 14px; margin-bottom: 6px; }
table.pt caption { text-align: left; font-weight: 700; font-size: 13px; color: var(--sub); padding: 4px 0; }
table.pt th { font-size: 11px; line-height: 1.3; color: var(--sub); font-weight: 600; padding: 2px 1px; }
table.pt td { padding: 3px 2px; text-align: center; vertical-align: top; }
table.pt td.ref { color: var(--sub); font-size: 13px; padding-top: 12px; overflow: hidden; text-overflow: ellipsis; }
table.pt input { width: 100%; text-align: right; padding: 8px 5px; }
.dev { font-size: 11px; color: var(--sub); text-align: right; min-height: 14px; }
.dev.ng { color: var(--ng); font-weight: 700; }
/* 入力欄の下の小さい表示：1行目に前回値（入力しても消えない）、2行目に誤差。横に並べると狭い画面で重なるため縦に積む */
.hint { display: flex; flex-direction: column; font-size: 10.5px; line-height: 1.35; margin-top: 1px; }
.hint .prev { color: #8a96a3; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hint .dev { font-size: inherit; min-height: 0; text-align: right; white-space: nowrap; }
.hint .dev:empty { display: none; }
/* 選択ダイアログ（中断時など） */
.modal { position: fixed; inset: 0; z-index: 30; background: rgba(0,0,0,.45); display: flex; align-items: flex-end; justify-content: center; padding: 16px 16px calc(env(safe-area-inset-bottom) + 16px); }
.modal .box { width: 100%; max-width: 480px; background: #fff; border-radius: 14px; padding: 16px; }
.modal .msg { font-size: 15px; white-space: pre-wrap; margin-bottom: 6px; }
.modal .btn.warn { border-color: #f3b4ae; }
/* 工場・報告書のメニュー */
.sect { font-size: 14px; color: var(--sub); margin: 16px 0 8px; font-weight: 700; }
.menu { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-bottom: 8px; }
.menu .main { flex: 1; min-width: 0; }
.menu .name { font-weight: 700; font-size: 17px; }
.menu .sub { font-size: 12px; color: var(--work); }
.menu .chev { color: var(--sub); font-size: 20px; }
.prog { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
.prog .bar { flex: 1; height: 8px; border-radius: 99px; background: #e4e8ee; overflow: hidden; }
.prog .bar i { display: block; height: 100%; background: var(--done); }
.prog .cnt { font-size: 14px; font-weight: 700; min-width: 64px; text-align: right; }
.prog.full .cnt { color: var(--done); }
.chk { display: flex; align-items: center; gap: 8px; color: var(--ink); font-size: 15px; margin: 6px 0 12px; }
.chk input { width: 22px; height: 22px; min-height: 0; margin: 0; }
.names { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.names button { padding: 12px 4px; border: 1px solid var(--line); border-radius: 10px; background: #fff; font-size: 16px; }
/* 使用部品（表示のみ。フィルター類だけ「交換済み」の目印を付けられる） */
.part { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
.part .pn { flex: 1; min-width: 0; word-break: break-all; }
.part .pq { flex: none; color: var(--sub); font-size: 13px; white-space: nowrap; }
.part .xchg { flex: none; min-height: 36px; padding: 6px 12px; border: 1px solid var(--line); border-radius: 99px; background: #fff; font-size: 14px; font-weight: 700; color: var(--sub); }
.part .xchg.on { background: var(--done); border-color: var(--done); color: #fff; }
/* 検査・作業員（押した順に番号） */
.names.pick button.on { background: var(--pri); border-color: var(--pri); color: #fff; font-weight: 700; }
.names.pick button:disabled { opacity: 1; }
/* 記事の Excel での見え方 */
.noteprev { margin: -4px 0 12px; font-size: 12px; color: var(--sub); }
.noteprev ol { margin: 4px 0 0; padding-left: 2.2em; font-family: "Hiragino Kaku Gothic ProN", monospace; color: var(--ink); }
.noteprev li.over { color: var(--ng); }
.noteprev .ng { color: var(--ng); font-weight: 700; }
.panel { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 10px; }
.panel .pname { font-weight: 700; }
.pitem { display: grid; grid-template-columns: minmax(0, 1fr) 120px; gap: 8px; align-items: center; margin-top: 8px; font-size: 14px; }
.pclock { display: grid; grid-template-columns: minmax(0, 1fr) 120px; gap: 8px; align-items: center; margin-top: 6px; font-size: 14px; }
.ptext { font-size: 12px; color: var(--sub); margin-top: 4px; }
.actions { position: fixed; left: 0; right: 0; bottom: 0; z-index: 4; padding: 8px 16px calc(env(safe-area-inset-bottom) + 8px); background: rgba(243,245,248,.96); border-top: 1px solid var(--line); }
.actions .inner { max-width: 760px; margin: 0 auto; display: flex; gap: 8px; }
.actions .btn { margin: 0; }
#kbbar { position: fixed; left: 0; right: 0; z-index: 20; display: flex; flex-direction: column; gap: 6px; padding: 6px 8px; background: #d1d5db; }
#kbbar[hidden] { display: none; }
.kbrow { display: flex; gap: 6px; }
.kbrow:empty { display: none; }
#kbbar button { flex: 1; min-width: 0; padding: 10px 4px; border: 0; border-radius: 8px; background: #fff; font-size: 16px; font-weight: 700; white-space: nowrap; }
#kbpre button { background: #e8f0f8; color: var(--pri); }
</style>
</head>
<body>
<header class="top" id="top"></header>
<main id="app"></main>
<div id="kbbar" hidden>
  <div class="kbrow" id="kbpre"></div>
  <div class="kbrow">
    <button type="button" data-kb="sign">± 符号</button>
    <button type="button" data-kb="prev">↑ 前へ</button>
    <button type="button" data-kb="next">↓ 次へ</button>
    <button type="button" data-kb="done">閉じる</button>
  </div>
</div>
<script>
'use strict';
const $ = s => document.querySelector(s);
const h = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clone = o => JSON.parse(JSON.stringify(o));
const ST = { TODO: '未着手', WORK: '作業中', DONE: '完了' };
const KIND = { KEIKI: '計器', VALVE: '調節弁', TOUCH: 'タッチパネル' };

// ---- 端末内保存（圏外でも入力が消えないよう、変更のたびに書き込む）----
const store = {
  get(k, d) { try { const v = localStorage.getItem('kensa.' + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('kensa.' + k, JSON.stringify(v)); } catch (e) { alert('端末への保存に失敗しました: ' + e.message); } },
};
let cfg = store.get('cfg', null);          // { api, key, name }（サーバーURLは公開ファイルに置かず、設定コードで端末に保存）
let names = store.get('names', []);
let devices = store.get('devices', []);
let fetchedAt = store.get('fetchedAt', '');
let drafts = store.get('drafts', {});      // 機器id → { data, rev, pending, finish, blocked }
// 画面の階層：plants（工場）→ locs（報告書＝Excelファイル）→ list（機器）→ detail（入力）。選んだ工場・報告書は次回も開く
const nav = store.get('nav', {});
let view = { screen: nav.plant ? (nav.loc ? 'list' : 'locs') : 'plants', plant: nav.plant || null, loc: nav.loc || null, from: null, id: null, filter: store.get('filter', 'all'), q: '' };
const saveNav = () => store.set('nav', { plant: view.plant, loc: view.loc });
let online = true;
let syncing = false;
let syncTimer = null;

if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');

const saveDrafts = () => store.set('drafts', drafts);
const getDev = id => devices.find(d => d.id === id);
const today = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
const hm = s => s ? String(s).slice(5, 16).replace('-', '/') : '';
const isNum = v => v !== null && v !== '' && !isNaN(+v);
const fmt = v => v == null || v === '' ? '' : isNum(v) ? String(+(+v).toFixed(4)) : String(v);

// ---- サーバー通信 ----
const ready = () => !!(cfg && cfg.api && cfg.key && cfg.name);

// conn: 接続先と合言葉（初期設定の接続確認では、保存前の値を渡す）
async function api(action, body, conn) {
  const c = conn || cfg;
  if (!c || !c.api || !c.key) throw Object.assign(new Error('初期設定が済んでいません'), { code: 'config' });
  let res;
  try {
    // Content-Type を付けない（text/plain）ことで、事前確認なしで Apps Script に送れる
    res = await fetch(c.api, { method: 'POST', body: JSON.stringify(Object.assign({ action, key: c.key, name: c.name }, body)) });
  } catch (e) {
    setOnline(false);
    throw Object.assign(new Error('通信できません（圏外の可能性があります）'), { code: 'offline' });
  }
  setOnline(true);
  let j;
  try { j = await res.json(); } catch (e) { throw Object.assign(new Error('サーバーの応答が読めません。設定コードが古い可能性があります'), { code: 'bad' }); }
  checkReset(j.resetId);
  if (!j.ok) {
    // 保存済みの合言葉が通らない＝合言葉が変更された。入力中のデータは残したまま再設定してもらう
    if (j.code === 'auth' && !conn && cfg && cfg.key) {
      cfg.key = '';
      store.set('cfg', cfg);
      setTimeout(() => { alert('合言葉が変更されました。新しい合言葉を入力してください（入力中のデータは残っています）。'); render(); }, 0);
    }
    throw Object.assign(new Error(j.error), { code: j.code });
  }
  return j;
}

// 事務所でデータが初期化されたら（resetId が変わったら）、端末内の入力途中データを捨てる。
// 残しておくと、テスト時の値が初期化後のサーバーへ送られてしまうため
function checkReset(resetId) {
  if (resetId === undefined) return;
  const known = store.get('resetId', null);
  if (known === resetId) return;
  store.set('resetId', resetId);
  if (resetId && Object.keys(drafts).length) {
    drafts = {};
    saveDrafts();
    renderNet();
    setTimeout(() => { alert('事務所でデータが初期化されました。この端末に残っていた入力途中のデータは消去しました。'); render(); }, 0);
  }
}

// 設定コード「KENSA1:<base64>」を { api, key } に戻す。URLだけを貼った場合はそのまま使う
// チャット経由のコピーで混ざりやすい改行・空白・見えない文字・全角コロン・前後の文章は無視する
function parseSetupCode(raw) {
  const s = raw.replace(/[\s ​-‍⁠　﻿]/g, '');
  const m = s.match(/KENSA1[:：]([A-Za-z0-9_\-+/]+=*)/i);
  if (!m) return { api: s, key: '' };
  try {
    const o = JSON.parse(atob(m[1].replace(/-/g, '+').replace(/_/g, '/')));
    return { api: o.u, key: o.k || '' };
  } catch (e) {
    return null;
  }
}

// 合言葉の表記ゆれを吸収する（「abcd-2345」のハイフン、空白、大文字、全角）
const normKey = v => v.replace(/[Ａ-Ｚａ-ｚ０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0))
  .replace(/[\s\-‐－ー―]/g, '').toLowerCase();

function setOnline(v) { online = v; renderNet(); }

function updateDevice(d) {
  const i = devices.findIndex(x => x.id === d.id);
  if (i >= 0) devices[i] = d; else devices.push(d);
  store.set('devices', devices);
}

async function refresh(quiet) {
  try {
    const j = await api('list', {});
    devices = j.devices;
    fetchedAt = j.now;
    store.set('devices', devices);
    store.set('fetchedAt', fetchedAt);
    if (j.names && j.names.length) {
      names = j.names;
      store.set('names', names);
      // 名簿から外れた名前のままなら選び直してもらう（未送信があれば送信を優先）
      if (cfg && cfg.name && !names.includes(cfg.name) && !Object.values(drafts).some(d => d.pending)) {
        alert(`名簿に「${cfg.name}」がありません。名前を選び直してください。`);
        cfg.name = '';
        store.set('cfg', cfg);
        render();
        return;
      }
    }
  } catch (e) {
    if (!quiet) alert(e.message);
  }
  if (view.screen !== 'detail') render();
}

// 未送信の入力を順に送る。失敗しても端末に残し、次の機会に再送する
async function sync() {
  if (syncing || !ready()) return;
  syncing = true;
  try {
    for (const id of Object.keys(drafts)) {
      const dr = drafts[id];
      if (!dr || !dr.pending || dr.blocked) continue;  // 送信中に初期化で消された下書きは飛ばす
      const rev = dr.rev;
      try {
        const j = await api('save', { id, data: dr.data, finish: !!dr.finish });
        updateDevice(j.device);
        const cur = drafts[id];
        if (cur && cur.rev === rev) {
          if (cur.finish) delete drafts[id]; else cur.pending = false;
        }
        saveDrafts();
      } catch (e) {
        if (['offline', 'busy', 'bad', 'auth', 'config', 'blocked'].includes(e.code)) break;
        if (drafts[id] !== dr) continue;  // 初期化で消された下書き
        dr.blocked = e.message;  // ロックを失った等。データは残してユーザーに知らせる
        saveDrafts();
      }
    }
  } finally {
    syncing = false;
    renderNet();
    if (ready() && view.screen !== 'detail') render();
  }
}

function scheduleSync(ms) {
  clearTimeout(syncTimer);
  syncTimer = setTimeout(sync, ms);
}

setInterval(async () => {
  if (!ready()) return;
  await sync();
  if (view.screen !== 'detail' && document.visibilityState === 'visible') refresh(true);
}, 30000);
window.addEventListener('online', () => sync());
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && ready()) { sync(); if (view.screen !== 'detail') refresh(true); } });

// ---- データ ----
function emptyCh() { return { up: ['', '', '', '', ''], down: ['', '', '', '', ''], adj: false, adjUp: ['', '', '', '', ''], adjDown: ['', '', '', '', ''] }; }

function normalize(d, data) {
  const prev = d.info.prev || {};
  const base = { date: today(), temp: '', note: (prev.note || []).join('\n'), inspectors: [cfg.name], replaced: {} };
  if (d.kind === KIND.KEIKI) Object.assign(base, { result: '合格' });
  if (d.kind === KIND.VALVE) Object.assign(base, { judge: '良好' });
  const out = Object.assign(base, data || {});
  out.inspectors = (out.inspectors || []).filter(Boolean).slice(0, MAX_STAMPS);
  out.replaced = out.replaced || {};
  out.ch = (d.info.chs || []).map((_, k) => Object.assign(emptyCh(), ((data && data.ch) || [])[k] || {}));
  if (d.kind === KIND.TOUCH) {
    out.panels = (d.info.panels || []).map((_, b) => Object.assign(
      { items: ['良好', '良好', '良好', '良好'], clockDir: '良好', clockMin: '' }, ((data && data.panels) || [])[b] || {}));
  }
  return out;
}

// 検査・作業員の欄（報告書の印影の枠）の数
const MAX_STAMPS = 5;
// 記事1行に入る文字数（半角=1、全角=2）。新しい登録データには機器ごとに入っている
const DEFAULT_NOTE_CAPS = Array(10).fill(60);
const isHalf = c => (c >= 0x20 && c <= 0x7E) || (c >= 0xFF61 && c <= 0xFF9F);

// 記事を Excel の記事欄1行に収まる長さで折り返す（pc/common.ps1 の Split-NoteLines と同じ計算）
function splitNote(text, caps) {
  const lines = [];
  String(text || '').split(/\r?\n/).forEach(para => {
    if (!para.trim()) return;
    let cur = '', w = 0;
    for (let i = 0; i < para.length; i++) {
      const cw = isHalf(para.charCodeAt(i)) ? 1 : 2;
      const cap = caps[Math.min(lines.length, caps.length - 1)];
      if (cur && w + cw > cap) { lines.push(cur); cur = ''; w = 0; }
      cur += para[i]; w += cw;
    }
    lines.push(cur);
  });
  return lines;
}

function notePreview(d, text) {
  const caps = d.info.noteCaps || DEFAULT_NOTE_CAPS;
  const lines = splitNote(text, caps);
  const over = lines.length - caps.length;
  return `Excelの記事欄（${caps.length}行）での見え方：長い行は自動で折り返します
    ${lines.length ? `<ol>${lines.map((l, n) => `<li class="${n >= caps.length ? 'over' : ''}">${h(l)}</li>`).join('')}</ol>` : ''}
    ${over > 0 ? `<div class="ng">記事欄に入りきりません（${over} 行はみ出しています）。はみ出した分はExcelに書き込まれません。</div>` : ''}`;
}

const isFilterPart = name => /ﾌｨﾙﾀ|フィルタ/.test(name || '');

// 時計の遅れ／進みから報告書の文言を作る（前年度の書き方に合わせる）
function clockText(p) {
  if (!p.clockDir || p.clockDir === '良好') return '良好';
  const m = String(p.clockMin || '').trim() || '○';
  return `ﾀｯﾁﾊﾟﾈﾙの内部時計時刻が${p.clockDir === '遅れ' ? '遅れて' : '進んで'}いたため実施（${m}分${p.clockDir}）`;
}

function setPath(obj, path, val) {
  const ks = path.split('.');
  let o = obj;
  for (let i = 0; i < ks.length - 1; i++) o = o[ks[i]];
  o[ks[ks.length - 1]] = val;
}

function touchDraft(id) {
  const dr = drafts[id];
  dr.rev = (dr.rev || 0) + 1;
  dr.pending = true;
  saveDrafts();
  renderNet();
  scheduleSync(4000);
}

function localStatus(d) {
  const dr = drafts[d.id];
  if (dr && dr.finish && dr.pending) return { cls: 'pend', text: '完了(未送信)' };
  if (d.status === ST.WORK) return { cls: 'work', text: d.worker === cfg.name ? '作業中(自分)' : '作業中 ' + d.worker };
  if (d.status === ST.DONE) return { cls: 'done', text: '完了' };
  return { cls: 'todo', text: '未着手' };
}

function countBlanks(d, data) {
  let n = 0;
  data.ch.forEach(c => {
    const keys = c.adj ? [['up', 'down'], ['adjUp', 'adjDown']] : [['up', 'down']];
    keys.forEach(([u, dn]) => {
      for (let i = 0; i < 5; i++) {
        if (String(c[u][i]).trim() === '') n++;
        if (i < 4 && String(c[dn][i]).trim() === '') n++;
      }
    });
  });
  return n;
}

// ---- 画面 ----
function render() {
  if (!ready()) return renderSetup();
  if (view.screen === 'detail') return renderDetail();
  // 選んでいた工場・報告書が一覧から無くなった（名前変更など）ときは一つ上の選択に戻す
  if (view.screen !== 'plants' && devices.length && !devices.some(d => plantOf(d) === view.plant)) view.screen = 'plants';
  if (view.screen === 'list' && view.loc !== ALL && !devices.some(d => plantOf(d) === view.plant && fileOf(d) === view.loc)) view.screen = 'locs';
  if (view.screen === 'plants') return renderPlants();
  if (view.screen === 'locs') return renderLocs();
  // 検索欄に入力中（自動更新など）は欄を作り直さず結果だけ更新する
  if (document.activeElement && document.activeElement.id === 'q' && $('#results')) {
    $('#results').innerHTML = listResults(listScope());
    return;
  }
  renderList();
}

const BACK_LABEL = { plants: '工場', locs: '報告書', list: '一覧' };

function renderTop(title, back) {
  $('#top').innerHTML = `${back ? `<button class="back" data-act="back">‹ ${h(back)}</button>` : ''}<div class="ttl">${h(title)}</div><button class="net" id="net" data-act="sync"></button>`;
  renderNet();
}

// ---- 工場・報告書（Excelファイル）のメニュー ----
const ALL = '__all__';
const plantOf = d => d.plant || '（工場名なし）';
const fileOf = d => d.file || '（報告書名なし）';
const fileLabel = f => f.replace(/_/g, ' ');
// 工場のメニュー名は「工場名＋今年の年度」
function plantLabel(p) {
  const years = devices.filter(d => plantOf(d) === p).map(d => +(d.info && d.info.year) || 0);
  const y = Math.max(0, ...years);
  return y ? `${p} ${y}年度` : p;
}
const isDone = d => ['done', 'pend'].includes(localStatus(d).cls);
const byName = (a, b) => a.localeCompare(b, 'ja', { numeric: true });

function progress(list) {
  const done = list.filter(isDone).length;
  const pct = list.length ? Math.round(done / list.length * 100) : 0;
  return `<div class="prog ${list.length && done === list.length ? 'full' : ''}"><div class="bar"><i style="width:${pct}%"></i></div><span class="cnt">完了 ${done}/${list.length}</span></div>`;
}

function menuItem(act, key, name, list) {
  const work = list.filter(d => d.status === ST.WORK).length;
  return `<button class="menu" data-act="${act}" data-key="${h(key)}">
    <div class="main"><div class="name">${h(name)}</div>${progress(list)}${work ? `<div class="sub">作業中 ${work}台</div>` : ''}</div>
    <span class="chev">›</span></button>`;
}

// 自分が作業中・未送信の機器は、どの画面からでもすぐ戻れるよう上に出す
function mineSection(list) {
  const mine = list.filter(d => (d.status === ST.WORK && d.worker === cfg.name) || (drafts[d.id] && drafts[d.id].pending));
  return mine.length ? `<div class="sect">自分の作業中</div>${mine.map(itemButton).join('')}` : '';
}

function itemButton(d) {
  const s = localStatus(d);
  const mine = d.status === ST.WORK && d.worker === cfg.name;
  return `<button class="item ${mine ? 'mine' : ''}" data-act="open" data-id="${h(d.id)}">
    <div class="main"><div class="tag">${h(d.tag)}</div><div class="sub">${h(d.title)}</div></div>
    <span class="badge st-${s.cls}">${h(s.text)}</span></button>`;
}

function renderPlants() {
  renderTop(`検査入力（${cfg.name}）`);
  const plants = [...new Set(devices.map(plantOf))].sort(byName);
  $('#app').innerHTML = `
    ${mineSection(devices)}
    <div class="sect">工場を選ぶ</div>
    ${plants.map(p => menuItem('plant', p, plantLabel(p), devices.filter(d => plantOf(d) === p))).join('') || '<p class="muted">機器が登録されていません</p>'}
    <div class="muted">更新 ${h(hm(fetchedAt))}</div>
    <button class="btn" data-act="refresh">一覧を更新</button>
    <button class="btn" data-act="logout" style="margin-top:24px">名前を変更する</button>`;
}

function renderLocs() {
  const inPlant = devices.filter(d => plantOf(d) === view.plant);
  renderTop(plantLabel(view.plant), BACK_LABEL.plants);
  const files = [...new Set(inPlant.map(fileOf))].sort(byName);
  $('#app').innerHTML = `
    ${mineSection(inPlant)}
    <div class="sect">報告書（Excel）を選ぶ</div>
    ${files.map(f => menuItem('loc', f, fileLabel(f), inPlant.filter(d => fileOf(d) === f))).join('')}
    ${menuItem('loc', ALL, 'すべての機器', inPlant)}
    <div class="muted">更新 ${h(hm(fetchedAt))}</div>
    <button class="btn" data-act="refresh">一覧を更新</button>`;
}

function renderNet() {
  const el = $('#net');
  if (!el) return;
  const n = Object.values(drafts).filter(d => d.pending).length;
  el.className = 'net' + (!online ? ' off' : n ? ' pend' : '');
  el.textContent = (online ? 'オンライン' : '圏外') + (n ? ` 未送信${n}` : '');
}

function renderSetup() {
  renderTop('検査入力 初期設定');
  const hasApi = cfg && cfg.api;
  const connected = hasApi && cfg.key;
  const keyField = `<label>合言葉<input id="s-key" type="password" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="例：abcd-2345"></label>`;
  // 接続済みなら合言葉は画面に出さず、名前選びだけを表示する。
  // 設定コード（URL）は覚えていて合言葉だけ無い＝合言葉が変わった場合は、合言葉の欄だけを出す
  $('#app').innerHTML = connected ? `
    <section class="card">
      <h2>名前を選ぶ</h2>
      <div class="notice done">サーバーに接続済みです。</div>
      <div id="s-names"></div>
      <button class="btn small" data-act="resetconn" style="margin-top:24px">接続設定をやり直す</button>
    </section>` : hasApi ? `
    <section class="card">
      <h2>合言葉の入力</h2>
      <p class="muted">合言葉が変更された場合は、新しい合言葉を事務所の担当者に確認してください。</p>
      ${keyField}
      <button class="btn primary" data-act="connect">接続して名前を選ぶ</button>
      <button class="btn small" data-act="resetconn" style="margin-top:24px">設定コードの貼り付けからやり直す</button>
    </section>` : `
    <section class="card">
      <h2>初期設定</h2>
      <label>設定コード<textarea id="s-code" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" style="min-height:90px" placeholder="KENSA1: で始まるコードを貼り付け"></textarea></label>
      ${keyField}
      <button class="btn primary" data-act="connect">接続して名前を選ぶ</button>
    </section>
    <p class="muted">設定コードと合言葉は事務所の担当者から受け取ってください。社外の人に見せないでください。</p>
    <p class="muted">Safari の共有ボタン →「ホーム画面に追加」で、圏外でもアプリとして開けるようになります。ホーム画面のアイコンから開いて設定してください。</p>`;
  if (connected) renderNames();
}

function renderNames() {
  const el = $('#s-names');
  if (!el) return;
  el.innerHTML = `<div class="muted" style="margin-bottom:8px">あなたの名前を選んでください</div>
    <div class="names">${names.map(n => `<button data-act="pickname" data-name="${h(n)}">${h(n)}</button>`).join('')}</div>`;
}

const FILTERS = { all: 'すべて', mine: '自分', todo: '未着手', work: '作業中', done: '完了' };

const listScope = () => devices.filter(d => plantOf(d) === view.plant && (view.loc === ALL || fileOf(d) === view.loc));

function renderList() {
  const scope = listScope();
  renderTop(view.loc === ALL ? 'すべての機器' : fileLabel(view.loc), BACK_LABEL.locs);
  const counts = Object.fromEntries(Object.values(ST).map(s => [s, scope.filter(d => d.status === s).length]));
  $('#app').innerHTML = `
    ${progress(scope)}
    <div class="filters" style="margin-top:10px">${Object.entries(FILTERS).map(([k, v]) => `<button class="${view.filter === k ? 'on' : ''}" data-act="filter" data-f="${k}">${v}</button>`).join('')}</div>
    <input class="search" id="q" type="search" placeholder="計器番号・調節弁番号・名称で検索" value="${h(view.q)}">
    <div class="muted">未着手 ${counts[ST.TODO]} ／ 作業中 ${counts[ST.WORK]} ／ 完了 ${counts[ST.DONE]}　<span>更新 ${h(hm(fetchedAt))}</span></div>
    <div id="results">${listResults(scope)}</div>
    <button class="btn" data-act="refresh">一覧を更新</button>`;
}

// 検索欄は作り直さず、結果だけを書き換える（日本語入力の変換中に欄を作り直すと文字が二重に入るため）
function listResults(scope) {
  const q = view.q.trim().toLowerCase();
  const match = d => {
    const st = d.status;
    const dr = drafts[d.id];
    if (view.filter === 'mine' && !(st === ST.WORK && d.worker === cfg.name) && !(dr && dr.pending)) return false;
    if (view.filter === 'todo' && st !== ST.TODO) return false;
    if (view.filter === 'work' && st !== ST.WORK) return false;
    if (view.filter === 'done' && st !== ST.DONE) return false;
    return !q || (d.tag + ' ' + d.title + ' ' + (d.info.name || '')).toLowerCase().includes(q);
  };
  const groups = {};
  scope.filter(match).forEach(d => (groups[d.file] = groups[d.file] || []).push(d));
  return Object.entries(groups).map(([file, list]) => `
      ${view.loc === ALL ? `<div class="group">${h(fileLabel(file))}</div>` : '<div style="height:8px"></div>'}
      ${list.map(itemButton).join('')}`).join('') || '<p class="muted">該当する機器がありません</p>';
}

function infoCard(d) {
  const i = d.info;
  const row = (k, v) => v ? `<dt>${k}</dt><dd>${v}</dd>` : '';
  const prev = `${h(i.prev.date || '')}　${h((i.prev.inspectors || []).filter(Boolean).join('・'))}`;
  if (d.kind === KIND.TOUCH) {
    return `<section class="card"><div style="font-weight:700">${h(d.tag)}</div><dl class="info">
      ${row('No.', h(i.no) + '（' + h(d.sheet) + '）')}${row('設置場所', h(i.loc))}${row('台数', i.panels.length + ' 台')}${row('前回', prev)}</dl></section>`;
  }
  return `<section class="card"><div style="font-weight:700">${h(i.name || d.title)}</div><dl class="info">
    ${row('No.', h(i.no) + '（' + h(d.sheet) + '）' + (i.kanri ? '　管理番号 ' + h(i.kanri) : ''))}
    ${row('場所', h(i.loc))}${row('型番', h(i.model))}${row('製造番号', h(i.serial))}
    ${row('範囲', (i.ranges || []).map(h).join('<br>'))}
    ${row('精度', i.accuracy != null ? '±' + h(i.accuracy) + ' %F.S' : '')}${row('前回', prev)}</dl></section>`;
}

function renderDetail() {
  const d = getDev(view.id);
  if (!d) { leaveDetail(); return render(); }
  renderTop(d.tag, BACK_LABEL[view.from] || BACK_LABEL.list);
  const mine = d.status === ST.WORK && d.worker === cfg.name;
  if (mine && !drafts[d.id]) { drafts[d.id] = { data: normalize(d, d.data), rev: 0, pending: false }; saveDrafts(); }
  const dr = drafts[d.id];
  let head = '', data = null, editable = false, actions = '';

  if (dr && dr.blocked) {
    head = `<div class="notice err">送信できませんでした：${h(dr.blocked)}<br>入力した値はこの端末に残っています。「作業を再開」でロックを取り直すと送信できます。</div>`;
    data = dr.data;
    actions = `<button class="btn primary" data-act="start">作業を再開</button>`;
  } else if (mine) {
    if (dr.finish && dr.pending) head = `<div class="notice work">完了済み（未送信）。電波が戻ると自動で送信されます。</div>`;
    data = dr.data;
    editable = true;
    actions = `<button class="btn warn" data-act="release" style="flex:1">作業を中断</button><button class="btn ok" data-act="finish" style="flex:2">完了して送信</button>`;
  } else if (d.status === ST.WORK) {
    head = `<div class="notice work"><b>${h(d.worker)}</b> さんが作業中です（${h(hm(d.startedAt))} 開始）。入力はできません。</div>`;
    data = d.data ? normalize(d, d.data) : null;
    actions = `<button class="btn warn" data-act="force">強制解除（放置されている場合）</button>`;
  } else if (d.status === ST.DONE) {
    head = `<div class="notice done">完了済みです（${h(hm(d.updatedAt))}${d.worker ? '・' + h(d.worker) : ''}）${d.exportedAt ? '・Excel反映済み' : ''}</div>`;
    data = normalize(d, d.data);
    actions = `<button class="btn" data-act="reopen">修正のため再開する</button>`;
  } else {
    head = `<div class="notice">この機器は未着手です。「作業開始」を押すと、他の人は入力できなくなります。</div>`;
    data = d.data ? normalize(d, d.data) : null;
    actions = `<button class="btn primary" data-act="start">作業開始</button>`;
  }

  $('#app').innerHTML = `${infoCard(d)}${head}
    ${data ? `<section class="card">${form(d, data, editable)}</section>` : ''}
    <div class="actions"><div class="inner">${actions}</div></div>`;
  if (data) updateDevs(d, data);
}

// ---- 入力フォーム ----
const opts = (list, v) => (list.includes(v) || !v ? list : list.concat([v])).map(x => `<option ${x === v ? 'selected' : ''}>${h(x)}</option>`).join('');

// prev（前回値）は入力欄の中の薄字に加え、入力後も見えるよう欄の下に小さく出す
function numInput(path, val, prev, editable, presets) {
  const p = fmt(prev);
  return `<input class="num" inputmode="decimal" autocomplete="off" data-k="${path}" value="${h(val)}" placeholder="${h(p)}"${presets ? ` data-presets="${h(presets)}"` : ''} ${editable ? '' : 'disabled'}>
    <div class="hint"><span class="prev">${p !== '' ? '前 ' + h(p) : ''}</span><span class="dev" data-dev="${path}"></span></div>`;
}

function pointTable(ch, k, upKey, downKey, c, editable, caption, showPrev) {
  const rows = ch.points.map((p, i) => `<tr>
      <td class="ref">${h(fmt(p.pct))}%</td>
      <td class="ref">${h(fmt(p.input))}</td>
      <td class="ref">${h(fmt(p.expect))}</td>
      <td>${numInput(`ch.${k}.${upKey}.${i}`, c[upKey][i], showPrev ? p.prevUp : '', editable, ch.presets)}</td>
      <td>${i < 4 ? numInput(`ch.${k}.${downKey}.${i}`, c[downKey][i], showPrev ? p.prevDown : '', editable, ch.presets) : '<div class="ref" style="padding-top:12px">―</div>'}</td>
    </tr>`).join('');
  return `<table class="pt"><caption>${caption}</caption>
    <colgroup><col style="width:15%"><col style="width:15%"><col style="width:16%"><col style="width:27%"><col style="width:27%"></colgroup>
    <thead><tr><th>測定点</th><th>入力<br>${h(ch.unitIn)}</th><th>${h(ch.expectLabel || '基準')}<br>${h(ch.unitDisp)}</th><th>UP</th><th>DOWN</th></tr></thead>
    <tbody>${rows}</tbody></table>`;
}

function form(d, data, editable) {
  const i = d.info;
  const dis = editable ? '' : 'disabled';
  const showDate = d.kind !== KIND.TOUCH || i.hasDate;
  const showTemp = d.kind !== KIND.VALVE;
  let html = `<div class="grid2">
      ${showDate ? `<label>試験日<input type="date" data-k="date" value="${h(data.date)}" ${dis}></label>` : ''}
      ${showTemp ? `<label>温度 (℃)<input class="num" inputmode="decimal" data-k="temp" value="${h(data.temp)}" placeholder="${h(fmt(i.prev.temp))}" ${dis}>
        <div class="hint"><span class="prev">${i.prev.temp != null ? '前回 ' + h(fmt(i.prev.temp)) + '℃' : ''}</span></div></label>` : ''}
    </div>
    ${showDate ? '' : '<p class="muted">この報告書には試験日の欄がありません。</p>'}`;

  if (d.kind === KIND.TOUCH) {
    html += i.panels.map((p, b) => {
      const pd = data.panels[b];
      const items = i.items.map((label, j) => {
        if (j === 2) {
          return `<div class="pclock"><span>${h(label)}</span>
              <select data-k="panels.${b}.clockDir" ${dis}>${opts(['良好', '遅れ', '進み'], pd.clockDir)}</select></div>
            ${pd.clockDir && pd.clockDir !== '良好' ? `<div class="pclock"><span>ずれ（分）</span>
              <input class="num" inputmode="decimal" data-k="panels.${b}.clockMin" value="${h(pd.clockMin)}" placeholder="分" ${dis}></div>` : ''}
            <div class="ptext" data-ptext="${b}">${h(pd.items[2])}</div>`;
        }
        return `<div class="pitem"><span>${h(label)}</span><select data-k="panels.${b}.items.${j}" ${dis}>${opts(['良好', '不良'], pd.items[j])}</select></div>`;
      }).join('');
      return `<div class="panel"><div class="pname">${h(p.name)}</div>
        <div class="muted">${h(p.model)}　${h(p.serial)}${p.made ? '　' + h(p.made) : ''}</div>${items}
        <div class="ptext">前回：${h((p.prev || []).filter(x => x && x !== '良好').join('／') || 'すべて良好')}</div></div>`;
    }).join('');
  } else {
    i.chs.forEach((ch, k) => {
      const c = data.ch[k];
      const title = d.kind === KIND.VALVE ? 'ストローク' : (i.chs.length > 1 ? 'CH' + (k + 1) + ' ' : '') + '測定値';
      html += `<h3>${title} <small>目盛 ${h(ch.scale)}　「前」＝前回値</small></h3>`;
      html += pointTable(ch, k, 'up', 'down', c, editable, '調整前', true);
      html += `<label class="chk"><input type="checkbox" data-k="ch.${k}.adj" ${c.adj ? 'checked' : ''} ${dis}>調整した（調整後の値も入力）</label>`;
      if (c.adj) html += pointTable(ch, k, 'adjUp', 'adjDown', c, editable, '調整後', false);
    });
    if (d.kind === KIND.KEIKI) {
      html += `<div class="grid2" style="margin-top:12px">
        <label>判定<select data-k="result" ${dis}>${opts(['合格', '不合格'], data.result)}</select></label></div>`;
    } else {
      html += `<div class="grid2" style="margin-top:12px">
        <label>判定<select data-k="judge" ${dis}>${opts(['良好', '動作不良'], data.judge)}</select></label></div>`;
    }
    // 使用部品：報告書（前年度）の内容を表示するだけ。フィルター類は交換したら「交換済み」を押す（見た目の確認用で報告書には書かない）
    const parts = i.prev.parts || [];
    html += `<h3>使用部品 <small>報告書の内容（変更はExcelで）</small></h3>` + (parts.length ? '' : '<p class="muted">なし</p>') +
      parts.map((p, n) => {
        const done = !!data.replaced[n];
        return `<div class="part"><span class="pn">${h(p.name)}</span>
          <span class="pq">${p.qty != null && p.qty !== '' ? h(fmt(p.qty)) + ' 個' : ''}${p.kind ? '　' + h(p.kind) : ''}</span>
          ${isFilterPart(p.name) ? `<button type="button" class="xchg ${done ? 'on' : ''}" data-act="replaced" data-n="${n}" ${dis}>${done ? '✓ 交換済み' : '交換済み'}</button>` : ''}
        </div>`;
      }).join('');
  }

  // 検査・作業員：押した順に番号が付き、報告書の検査・作業員欄へ右詰めで印影が入る
  const sel = data.inspectors;
  const pick = [...new Set(names.concat(sel))];
  html += `<h3>検査・作業員 <small>押した順に報告書の欄へ右詰めで印影が入ります（最大${MAX_STAMPS}名）</small></h3>
    <div class="names pick">${pick.map(n => {
      const k = sel.indexOf(n);
      return `<button type="button" class="${k >= 0 ? 'on' : ''}" data-act="insp" data-name="${h(n)}" ${dis}>${k >= 0 ? (k + 1) + '. ' : ''}${h(n)}</button>`;
    }).join('')}</div>
    <label style="margin-top:14px">記事<textarea data-k="note" ${dis}>${h(data.note)}</textarea></label>
    <div class="noteprev" id="noteprev">${notePreview(d, data.note)}</div>
    ${i.chs && i.chs.length ? '<p class="muted">誤差は「(測定値−基準)÷スパン」の目安です。精度を超えると赤字になります。正式な値はExcelで計算されます。</p>' : ''}`;
  return html;
}

function updateDevs(d, data) {
  document.querySelectorAll('[data-dev]').forEach(el => {
    const [, k, key, i] = el.dataset.dev.split('.');
    const ch = d.info.chs[k];
    const p = ch && ch.points[i];
    const v = data.ch[k][key][i];
    if (!p || !isNum(v) || !isNum(p.expect) || !ch.span) { el.textContent = ''; el.className = 'dev'; return; }
    const dev = (+v - +p.expect) / ch.span * 100;
    el.textContent = (dev > 0 ? '+' : '') + dev.toFixed(2) + '%';
    el.className = 'dev' + (d.info.accuracy != null && Math.abs(dev) > d.info.accuracy + 1e-9 ? ' ng' : '');
  });
}

// ---- 操作 ----
async function startWork(reopen) {
  const id = view.id;
  try {
    const j = await api('start', { id, reopen: !!reopen });
    updateDevice(j.device);
    const dr = drafts[id];
    if (dr) {
      dr.blocked = null;  // 端末に残っている入力を優先して続ける
      if (dr.pending) scheduleSync(500);
    } else {
      drafts[id] = { data: normalize(j.device, j.device.data), rev: 0, pending: false };
    }
    saveDrafts();
  } catch (e) {
    alert(e.code === 'offline' ? '作業開始（ロック）には電波が必要です。電波のある場所で押してください。' : e.message);
    if (e.code === 'locked' || e.code === 'done') await refresh(true);
  }
  render();
}

// 画面下からせり上がる選択ダイアログ。押したボタンの key を返す（外側を押したら null）
function choose(message, options) {
  return new Promise(resolve => {
    const el = document.createElement('div');
    el.className = 'modal';
    el.innerHTML = `<div class="box"><div class="msg">${h(message)}</div>
      ${options.map(o => `<button class="btn ${o.cls || ''}" data-choose="${o.key}">${h(o.label)}</button>`).join('')}</div>`;
    el.addEventListener('click', e => {
      const b = e.target.closest('[data-choose]');
      if (!b && e.target !== el) return;
      el.remove();
      resolve(b ? b.dataset.choose : null);
    });
    document.body.appendChild(el);
  });
}

async function releaseWork() {
  const c = await choose('作業を中断して、他の人も入力できるようにします。ここまでの入力をどうしますか？', [
    { key: 'save', label: '保存して中断（入力を残す）', cls: 'primary' },
    { key: 'discard', label: '破棄して中断（開始前に戻す）', cls: 'warn' },
    { key: 'cancel', label: 'キャンセル（作業を続ける）' },
  ]);
  if (c !== 'save' && c !== 'discard') return;
  if (c === 'discard' && !confirm('作業開始後に入力した値をすべて消して、作業開始前の状態に戻します。アプリからは元に戻せません。よろしいですか？')) return;
  const id = view.id;
  try {
    const dr = drafts[id];
    if (c === 'save' && dr && dr.pending) await api('save', { id, data: dr.data, finish: false });
    const j = await api('release', { id, discard: c === 'discard' });
    updateDevice(j.device);
    delete drafts[id];
    saveDrafts();
    leaveDetail();
  } catch (e) {
    alert(e.code === 'offline' ? '中断（ロック解除）には電波が必要です。' : e.message);
  }
  render();
}

async function forceRelease() {
  const d = getDev(view.id);
  if (!confirm(`${d.worker} さんの作業を強制的に解除します。\n${d.worker} さんのiPhoneに未送信の入力が残っている場合、その人は「作業を再開」が必要になります。\n本人に確認しましたか？`)) return;
  try {
    const j = await api('forceRelease', { id: d.id });
    updateDevice(j.device);
  } catch (e) {
    alert(e.code === 'offline' ? '強制解除には電波が必要です。' : e.message);
  }
  render();
}

async function finishWork() {
  const d = getDev(view.id);
  const dr = drafts[view.id];
  const blanks = countBlanks(d, dr.data);
  const over = splitNote(dr.data.note, d.info.noteCaps || DEFAULT_NOTE_CAPS).length - (d.info.noteCaps || DEFAULT_NOTE_CAPS).length;
  if (over > 0 && !confirm(`記事が記事欄に入りきりません（${over} 行はみ出し）。はみ出した分はExcelに書き込まれません。このまま完了にしますか？`)) return;
  if (!dr.data.inspectors.length && !confirm('検査・作業員が選ばれていません。このまま完了にしますか？')) return;
  if (blanks && !confirm(`未入力の測定値が ${blanks} か所あります。このまま完了にしますか？`)) return;
  if (!blanks && !confirm('完了にして送信します。よろしいですか？')) return;
  dr.finish = true;
  touchDraft(view.id);
  await sync();
  alert(drafts[view.id] ? 'この端末に保存しました。電波が戻ると自動で送信されます。' : '送信しました。');
  leaveDetail();
  render();
}

// 入力画面から、開く前にいた画面（工場・報告書・一覧）へ戻る
function leaveDetail() {
  view.screen = view.from && view.from !== 'detail' ? view.from : 'list';
}

// 入力画面のボタン操作（検査・作業員、交換済み）で下書きを変更する
function editDraft(fn) {
  const dr = drafts[view.id];
  const d = getDev(view.id);
  if (!dr || !d || !(d.status === ST.WORK && d.worker === cfg.name) || dr.blocked) return;
  if (fn(dr.data) === false) return;
  touchDraft(view.id);
  renderDetail();
}

function toggleInspector(name) {
  editDraft(data => {
    const i = data.inspectors.indexOf(name);
    if (i >= 0) { data.inspectors.splice(i, 1); return; }
    if (data.inspectors.length >= MAX_STAMPS) { alert(`検査・作業員の欄は ${MAX_STAMPS} 名までです。`); return false; }
    data.inspectors.push(name);
  });
}

// ---- イベント ----
document.addEventListener('click', async e => {
  const b = e.target.closest('[data-act]');
  if (!b) return;
  const act = b.dataset.act;
  if (act === 'back') {
    if (view.screen === 'detail') leaveDetail();
    else view.screen = view.screen === 'list' ? 'locs' : 'plants';
    render();
    window.scrollTo(0, 0);
    refresh(true);
  }
  else if (act === 'plant') { view.plant = b.dataset.key; view.loc = null; view.screen = 'locs'; saveNav(); render(); window.scrollTo(0, 0); }
  else if (act === 'loc') { view.loc = b.dataset.key; view.screen = 'list'; view.q = ''; saveNav(); render(); window.scrollTo(0, 0); }
  else if (act === 'sync') { await sync(); if (ready()) await refresh(); }
  else if (act === 'connect') {
    let parsed = { api: cfg && cfg.api, key: '' };
    const codeEl = $('#s-code');
    if (codeEl) {
      const raw = codeEl.value.trim();
      parsed = parseSetupCode(raw);
      // 途中で切れている等の調査用に、貼り付けた文字数と先頭を表示する
      const bad = () => alert(`設定コードが正しくありません。もう一度コピーして貼り付けてください。\n（貼り付けた文字数：${raw.length}、先頭：${raw.slice(0, 10)}…）\n正しいコードは「KENSA1:」で始まる約170文字です。`);
      if (!parsed || !/^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(parsed.api)) return bad();
    }
    const key = normKey($('#s-key').value) || parsed.key;
    if (!key) return alert('合言葉を入力してください。');
    const conn = { api: parsed.api, key, name: '' };
    try {
      const j = await api('hello', {}, conn);
      cfg = conn;
      store.set('cfg', cfg);
      names = j.names;
      store.set('names', names);
      render();
    } catch (err) { alert(err.message); }
  }
  else if (act === 'resetconn') {
    if (Object.values(drafts).some(d => d.pending)) return alert('未送信のデータがあります。送信してからやり直してください。');
    if (!confirm('接続設定を消して、設定コードの貼り付けからやり直します。よろしいですか？')) return;
    cfg = null; store.set('cfg', cfg); render();
  }
  else if (act === 'pickname') { cfg.name = b.dataset.name; store.set('cfg', cfg); await refresh(true); render(); sync(); }
  else if (act === 'logout') {
    if (Object.values(drafts).some(d => d.pending)) return alert('未送信のデータがあります。送信してから変更してください。');
    cfg.name = ''; store.set('cfg', cfg); render();
  }
  else if (act === 'filter') { view.filter = b.dataset.f; store.set('filter', view.filter); render(); }
  else if (act === 'refresh') refresh();
  else if (act === 'open') { view.from = view.screen; view.screen = 'detail'; view.id = b.dataset.id; render(); window.scrollTo(0, 0); }
  else if (act === 'start') startWork(false);
  else if (act === 'reopen') { if (confirm('完了済みの機器を修正のため再開します。よろしいですか？')) startWork(true); }
  else if (act === 'release') releaseWork();
  else if (act === 'force') forceRelease();
  else if (act === 'finish') finishWork();
  else if (act === 'insp') toggleInspector(b.dataset.name);
  else if (act === 'replaced') editDraft(data => { const n = b.dataset.n; if (data.replaced[n]) delete data.replaced[n]; else data.replaced[n] = true; });
});

function onEdit(e) {
  const t = e.target;
  if (t.id === 'q') {
    if (e.isComposing) return;  // 日本語の変換中は確定（compositionend）まで待つ
    view.q = t.value;
    const r = $('#results');
    if (r) r.innerHTML = listResults(listScope());
    return;
  }
  const k = t.dataset.k;
  if (!k || view.screen !== 'detail') return;
  const dr = drafts[view.id];
  if (!dr || t.disabled) return;
  setPath(dr.data, k, t.type === 'checkbox' ? t.checked : t.value);
  const clock = k.match(/^panels\.(\d+)\.clock(Dir|Min)$/);
  if (clock) {
    const p = dr.data.panels[clock[1]];
    p.items[2] = clockText(p);
    const pt = document.querySelector(`[data-ptext="${clock[1]}"]`);
    if (pt) pt.textContent = p.items[2];
  }
  touchDraft(view.id);
  if (t.type === 'checkbox' || (clock && clock[2] === 'Dir')) renderDetail();
  else if (k.startsWith('ch.')) updateDevs(getDev(view.id), dr.data);
  else if (k === 'note') { const np = $('#noteprev'); if (np) np.innerHTML = notePreview(getDev(view.id), dr.data.note); }
}
document.addEventListener('input', onEdit);
document.addEventListener('compositionend', e => { if (e.target.id === 'q') onEdit(e); });
document.addEventListener('change', e => { if (e.target.tagName === 'SELECT' || e.target.type === 'checkbox' || e.target.type === 'date') onEdit(e); });

// 数値キーボードにはマイナスや文字が無いため、キーボードの上に「±」「CLOSE」などのバーを出す
const kb = $('#kbbar');
const kbpre = $('#kbpre');
let activeNum = null;
function placeKb() {
  const vv = window.visualViewport;
  const top = vv ? vv.offsetTop + vv.height - kb.offsetHeight : window.innerHeight - kb.offsetHeight;
  kb.style.top = top + 'px';
}
document.addEventListener('focusin', e => {
  if (!e.target.matches('input.num')) return;
  activeNum = e.target;
  const pre = (activeNum.dataset.presets || '').split(',').filter(Boolean);
  kbpre.innerHTML = pre.map(v => `<button type="button" data-kb="preset" data-v="${h(v)}">${h(v)}</button>`).join('');
  kb.hidden = false;
  placeKb();
});
document.addEventListener('focusout', () => setTimeout(() => {
  if (!document.activeElement || !document.activeElement.matches('input.num')) { kb.hidden = true; activeNum = null; }
}, 100));
if (window.visualViewport) {
  visualViewport.addEventListener('resize', placeKb);
  visualViewport.addEventListener('scroll', placeKb);
}
kb.addEventListener('pointerdown', e => e.preventDefault());  // 押してもキーボードを閉じない
kb.addEventListener('click', e => {
  const b = e.target.closest('[data-kb]');
  if (!b || !activeNum) return;
  const inputs = [...document.querySelectorAll('input.num:not(:disabled)')];
  const idx = inputs.indexOf(activeNum);
  const set = v => { activeNum.value = v; activeNum.dispatchEvent(new Event('input', { bubbles: true })); };
  if (b.dataset.kb === 'sign') {
    const v = activeNum.value.trim();
    set(v.startsWith('-') ? v.slice(1) : '-' + v);
  } else if (b.dataset.kb === 'preset') {
    set(b.dataset.v);
    if (inputs[idx + 1]) inputs[idx + 1].focus();
  } else if (b.dataset.kb === 'next' && inputs[idx + 1]) inputs[idx + 1].focus();
  else if (b.dataset.kb === 'prev' && inputs[idx - 1]) inputs[idx - 1].focus();
  else if (b.dataset.kb === 'done') activeNum.blur();
});

render();
if (ready()) { sync(); refresh(true); }
</script>
</body>
