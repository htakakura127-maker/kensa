<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>電流モニター</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 16px;
      background: #111;
      color: white;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        sans-serif;
      text-align: center;
    }

    .title {
      font-size: 24px;
      margin-top: 8px;
      margin-bottom: 18px;
    }

    /* 主幹電流 */
    .main {
      background: #222;
      border-radius: 24px;
      padding: 22px 15px;
      margin-bottom: 18px;
      transition: background .3s;
    }

    .main.warn {
      background: #6b4a00;
    }

    .main.alarm {
      background: #7a1515;
    }

    .main-name {
      font-size: 22px;
      margin-bottom: 8px;
    }

    .main-current {
      font-size: 64px;
      font-weight: bold;
      font-variant-numeric: tabular-nums;
      line-height: 1.1;
    }

    .main-unit {
      font-size: 26px;
      margin-left: 4px;
    }

    .main-detail {
      font-size: 15px;
      color: #aaa;
      margin-top: 8px;
    }

    /* CH1 / CH2 */
    .channel {
      background: #222;
      border-radius: 20px;
      padding: 18px;
      margin-bottom: 14px;
    }

    .channel-name {
      font-size: 22px;
      margin-bottom: 6px;
    }

    .current {
      font-size: 50px;
      font-weight: bold;
      font-variant-numeric: tabular-nums;
      line-height: 1.1;
    }

    .unit {
      font-size: 22px;
      margin-left: 4px;
    }

    .power {
      font-size: 18px;
      color: #aaa;
      margin-top: 5px;
    }

    /* 状態 */
    .status {
      margin-top: 20px;
      font-size: 14px;
      color: #aaa;
      line-height: 1.7;
    }

    .update {
      font-size: 18px;
      margin-top: 5px;
      font-variant-numeric: tabular-nums;
    }

    .lag {
      font-size: 26px;
      font-weight: bold;
      color: #fff;
      font-variant-numeric: tabular-nums;
    }

    .lag.slow {
      color: #ffb020;
    }

    .lag.stale {
      color: #ff5555;
    }

    .error {
      color: #ff5555;
    }

    .flash {
      animation: flash .6s;
    }

    @keyframes flash {
      from { color: #6cf; }
      to { color: inherit; }
    }
  </style>
</head>

<body>

  <div class="title">
    電流モニター
  </div>


  <!-- 主幹電流 -->
  <div id="main" class="main">

    <div class="main-name">
      主幹電流
    </div>

    <span id="mainCurrent" class="main-current">
      --.---
    </span>

    <span class="main-unit">
      A
    </span>

    <div id="mainDetail" class="main-detail">
      CH1 / CH2 最大値
    </div>

  </div>


  <!-- CH1 -->
  <div class="channel">

    <div class="channel-name">
      CH1
    </div>

    <span id="ch1Current" class="current">
      --.---
    </span>

    <span class="unit">
      A
    </span>

    <div id="ch1Power" class="power">
      --.- W
    </div>

  </div>


  <!-- CH2 -->
  <div class="channel">

    <div class="channel-name">
      CH2
    </div>

    <span id="ch2Current" class="current">
      --.---
    </span>

    <span class="unit">
      A
    </span>

    <div id="ch2Power" class="power">
      --.- W
    </div>

  </div>


  <!-- 状態 -->
  <div class="status">

    データの遅れ

    <div id="lag" class="lag">
      --
    </div>

    <div id="sourceTime" class="update">
      --:--:--
    </div>

    <br>

    取得状態

    <div id="status">
      初期化中...
    </div>

    <div id="interval">
      --
    </div>

  </div>


<script>

  // 取得と取得の最短間隔（ミリ秒）
  const MIN_GAP_MS = 1000;

  // 機器の更新間隔が分からないときの取得間隔
  const DEFAULT_GAP_MS = 2000;

  // 新しい点が出るはずの時刻から少し待ってから取りに行く余裕
  const MARGIN_MS = 300;

  let last = null;          // 最後に受け取ったデータ
  let receivedAt = 0;       // それを受け取った時刻（この端末の時計）
  let lastSourceMs = null;
  let timer = null;
  let inFlight = false;     // 通信中か


  /*
   * 受け取ったデータを画面に表示
   */
  function showData(data) {

    const ch1Current = Number(data.ch1.current);
    const ch2Current = Number(data.ch2.current);
    const mainCurrent = Math.max(ch1Current, ch2Current);

    const isNew = data.source_ms !== lastSourceMs;
    lastSourceMs = data.source_ms;

    setText('ch1Current', ch1Current.toFixed(3), isNew);
    setText('ch1Power', Number(data.ch1.power).toFixed(1) + ' W', isNew);

    setText('ch2Current', ch2Current.toFixed(3), isNew);
    setText('ch2Power', Number(data.ch2.power).toFixed(1) + ' W', isNew);

    setText('mainCurrent', mainCurrent.toFixed(3), isNew);

    document.getElementById('mainDetail').textContent =
      (ch1Current >= ch2Current ? 'CH1：' + ch1Current.toFixed(3) : 'CH2：' + ch2Current.toFixed(3)) + ' A';

    // ★ 20A超過 / 25A超過で背景色を変える
    const main = document.getElementById('main');
    main.classList.toggle('alarm', mainCurrent > 25);
    main.classList.toggle('warn', mainCurrent > 20 && mainCurrent <= 25);

    document.getElementById('sourceTime').textContent =
      'データ時刻 ' + (data.source_ms ? hms(new Date(data.source_ms)) : data.source_time_ch1);

    document.getElementById('interval').textContent =
      data.interval_ms ? '機器の更新間隔: 約' + (data.interval_ms / 1000).toFixed(1) + '秒' : '';

    document.getElementById('status').textContent = '取得成功';

    last = data;
    receivedAt = Date.now();
    showLag();
  }


  function setText(id, text, flash) {
    const el = document.getElementById(id);
    el.textContent = text;
    if (flash) {
      el.classList.remove('flash');
      void el.offsetWidth;
      el.classList.add('flash');
    }
  }


  function hms(d) {
    const p = n => ('0' + n).slice(-2);
    return p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
  }


  /*
   * 「データの遅れ」＝ 今 − 機器のデータ時刻
   * サーバーで計算した遅れに、受け取ってからの経過時間を足す（端末の時計ズレの影響を受けない）
   */
  function showLag() {

    const el = document.getElementById('lag');

    if (!last || last.age_ms === null || last.age_ms === undefined) {
      el.textContent = '--';
      return;
    }

    const lagMs = last.age_ms + (Date.now() - receivedAt);
    const interval = last.interval_ms || 10000;

    el.textContent = (Math.max(0, lagMs) / 1000).toFixed(1) + ' 秒';
    el.classList.toggle('slow', lagMs > interval * 1.5 && lagMs <= interval * 3);
    el.classList.toggle('stale', lagMs > interval * 3);
  }


  /*
   * 次に取りに行くまでの待ち時間を決める
   * 機器の更新間隔が分かれば「次の点が出るはずの時刻」に合わせて取りに行く
   */
  function nextDelay(data, tookMs) {

    if (!data || !data.interval_ms || data.age_ms === null || data.age_ms === undefined) {
      return DEFAULT_GAP_MS;
    }

    const lagNow = data.age_ms + tookMs / 2;

    // 機器から長く届いていない（停止・圏外など）ときはゆっくり
    if (lagNow > data.interval_ms * 3) {
      return 5000;
    }

    // 次の点が出るはずの時刻まで待つ（取得にかかる時間ぶん早めに出発）
    const wait = data.interval_ms - lagNow - tookMs + MARGIN_MS;

    return Math.min(Math.max(wait, MIN_GAP_MS), data.interval_ms);
  }


  /*
   * Informetisからデータ取得（前回が終わったらすぐ次を予約）
   */
  function updateData() {

    timer = null;

    if (document.hidden) {
      return;
    }

    inFlight = true;

    const started = Date.now();

    google.script.run

      .withSuccessHandler(function(data) {

        inFlight = false;
        const took = Date.now() - started;

        if (!data || !data.ok) {
          document.getElementById('status').innerHTML =
            '<span class="error">取得エラー: ' + escapeHtml(data && data.error) + '</span>';
          schedule(3000);
          return;
        }

        showData(data);
        schedule(nextDelay(data, took));
      })

      .withFailureHandler(function(error) {

        inFlight = false;

        document.getElementById('status').innerHTML =
          '<span class="error">取得失敗: ' + escapeHtml(error && error.message) + '</span>';

        schedule(3000);
      })

      .getInformetisData();
  }


  function schedule(ms) {
    if (timer) clearTimeout(timer);
    timer = setTimeout(updateData, ms);
  }


  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }


  /*
   * 画面を閉じている・裏にあるときは取得を止める（Apps Scriptの1日の上限を使い切らないため）
   */
  document.addEventListener('visibilitychange', function() {
    if (document.hidden) {
      if (timer) clearTimeout(timer);
      timer = null;
      document.getElementById('status').textContent = '一時停止中';
    } else if (!inFlight && !timer) {
      updateData();
    }
  });


  // 遅れの表示は0.2秒ごとに更新
  setInterval(showLag, 200);


  // 最初のデータ取得
  updateData();

</script>

</body>
</html>
